<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JadeverBodega - Ferretería & Control</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            500: '#ea580c',
                            600: '#d97706',
                            700: '#b45309',
                            900: '#78350f',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Inter & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS for Excel parsing -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- html2pdf for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 3px; }
        @media print {
            aside, header, .no-print { display: none !important; }
            main { padding: 0 !important; margin: 0 !important; width: 100% !important; }
            .bg-gray-950, .bg-gray-900, .bg-white { background: white !important; color: black !important; border: 1px solid #ccc !important; }
        }
    </style>
</head>
<body id="app-body" class="bg-gray-900 text-gray-100 flex h-screen overflow-hidden">

    <!-- Toast Notification container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2"></div>

    <!-- Modal Container -->
    <div id="global-modal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm flex items-center justify-center p-4"></div>

    <!-- PANTALLA DE BLOQUEO Y ACCESO POR CLAVE -->
    <div id="auth-overlay" class="fixed inset-0 z-50 bg-gray-950 flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-3xl p-8 space-y-6 text-center shadow-2xl">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-amber-600 to-amber-500 flex items-center justify-center text-white text-2xl mx-auto shadow-lg shadow-amber-600/30">
                <i class="fa-solid fa-lock"></i>
            </div>
            
            <div>
                <h2 class="text-xl font-bold text-white tracking-tight">JadeverBodega</h2>
                <p class="text-xs text-amber-500 font-semibold tracking-wide uppercase mt-1">Acceso Protegido</p>
                <p class="text-xs text-gray-400 mt-2">Ingresa tu PIN de acceso para continuar</p>
            </div>

            <form onsubmit="handleAuthLogin(event)" class="space-y-4">
                <div class="relative">
                    <input type="password" id="auth-pin-input" maxlength="10" placeholder="••••" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3.5 text-center text-2xl tracking-widest text-white focus:outline-none focus:border-amber-500 transition">
                </div>
                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-semibold py-3 rounded-xl text-sm transition shadow-lg shadow-amber-600/20">
                    Ingresar al Sistema
                </button>
            </form>

            <div class="border-t border-gray-800 pt-4 text-[11px] text-gray-500">
                <span>Modos disponibles: Administrador (Control Total) u Observador (Solo Lectura)</span>
            </div>
        </div>
    </div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="w-64 bg-gray-950 border-r border-gray-800 flex flex-col transition-all duration-300 z-30 shadow-xl">
        <!-- Logo Header -->
        <div class="p-5 border-b border-gray-800 flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-600 to-amber-500 flex items-center justify-center text-white font-bold shadow-lg shadow-amber-600/30">
                <i class="fa-solid fa-screwdriver-wrench"></i>
            </div>
            <div>
                <h1 id="logo-title" class="font-bold text-base tracking-tight text-white leading-tight">JadeverBodega</h1>
                <span class="text-xs text-amber-500 font-semibold tracking-wide">FERRETERÍA & CONTROL</span>
            </div>
        </div>

        <!-- NAVIGATION MENU -->
        <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto custom-scrollbar">
            <button onclick="switchTab('inventario')" id="nav-inventario" class="nav-btn w-full flex items-center justify-between px-3.5 py-3 rounded-xl text-sm font-medium transition-colors bg-amber-600 text-white shadow-md">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-boxes-stacked w-5 text-center"></i>
                    <span>Inventario</span>
                </div>
                <span id="badge-inventario" class="px-2 py-0.5 text-xs bg-white/20 rounded-full font-bold">0</span>
            </button>

            <button onclick="switchTab('movimientos')" id="nav-movimientos" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-sm font-medium text-gray-400 hover:bg-gray-800/50 hover:text-white transition-colors">
                <i class="fa-solid fa-right-left w-5 text-center"></i>
                <span>Movimientos</span>
            </button>

            <button onclick="switchTab('pedidos')" id="nav-pedidos" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-sm font-medium text-gray-400 hover:bg-gray-800/50 hover:text-white transition-colors">
                <i class="fa-solid fa-cart-shopping w-5 text-center"></i>
                <span>Pedidos</span>
            </button>

            <button onclick="switchTab('informes')" id="nav-informes" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-sm font-medium text-gray-400 hover:bg-gray-800/50 hover:text-white transition-colors">
                <i class="fa-solid fa-chart-pie w-5 text-center"></i>
                <span>Informes</span>
            </button>

            <button onclick="switchTab('mas')" id="nav-mas" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-sm font-medium text-gray-400 hover:bg-gray-800/50 hover:text-white transition-colors">
                <i class="fa-solid fa-gear w-5 text-center"></i>
                <span>Más</span>
            </button>

            <button onclick="switchTab('cargamasiva')" id="nav-cargamasiva" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-sm font-medium text-gray-400 hover:bg-gray-800/50 hover:text-white transition-colors">
                <i class="fa-solid fa-file-excel w-5 text-center text-emerald-400"></i>
                <span>Carga masiva</span>
            </button>
        </nav>

        <!-- Dark Mode Toggle & User Profile -->
        <div class="p-4 border-t border-gray-800 space-y-3">
            <div id="theme-card" class="flex items-center justify-between bg-gray-900 border border-gray-800 p-2.5 rounded-xl">
                <div class="flex items-center space-x-2 text-xs font-medium text-gray-300" id="theme-label-box">
                    <i class="fa-solid fa-moon text-amber-500" id="theme-icon"></i>
                    <span id="theme-text">Modo Oscuro</span>
                </div>
                <button onclick="toggleTheme()" class="p-1 rounded-lg bg-gray-800 hover:bg-gray-700 text-amber-400 transition">
                    <i class="fa-solid fa-circle-half-stroke text-sm"></i>
                </button>
            </div>

            <div class="flex items-center justify-between p-2">
                <div class="flex items-center space-x-3">
                    <div id="user-avatar" class="w-9 h-9 rounded-full bg-gradient-to-br from-amber-500 to-amber-700 flex items-center justify-center font-bold text-white text-sm shadow">
                        WH
                    </div>
                    <div class="overflow-hidden">
                        <p id="user-name" class="text-sm font-semibold text-white truncate">Wendy Hernandez</p>
                        <p id="user-role" class="text-xs text-amber-500 font-medium flex items-center space-x-1">
                            <i class="fa-solid fa-shield-halved text-[10px]"></i>
                            <span>Administrator</span>
                        </p>
                    </div>
                </div>
                <button onclick="logoutAuth()" title="Cerrar Sesión" class="text-gray-400 hover:text-red-400 text-xs p-1">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main id="app-main" class="flex-1 flex flex-col h-screen overflow-hidden bg-gray-900">
        
        <!-- TOP APP BAR -->
        <header id="top-header" class="h-16 bg-gray-950 border-b border-gray-800 px-6 flex items-center justify-between z-20">
            <div class="flex items-center space-x-4">
                <div class="text-xs text-gray-400 font-medium hidden md:block">
                    <span id="current-date-header" class="font-semibold uppercase tracking-wider"></span>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <button id="btn-top-excel" onclick="switchTab('cargamasiva')" class="flex items-center space-x-2 bg-gray-800 hover:bg-gray-700 text-gray-200 px-3.5 py-2 rounded-xl text-xs font-semibold border border-gray-700 transition shadow-sm">
                    <i class="fa-solid fa-file-excel text-emerald-400"></i>
                    <span>Cargar Excel</span>
                </button>
                <button id="btn-top-add-product" onclick="openAddProductModal()" class="flex items-center space-x-2 bg-amber-600 hover:bg-amber-500 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-lg shadow-amber-600/30 transition">
                    <i class="fa-solid fa-plus"></i>
                    <span>+ Producto</span>
                </button>
            </div>
        </header>

        <!-- DYNAMIC VIEWS CONTAINER -->
        <div class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar" id="main-content-view">
            <!-- Dynamic Content -->
        </div>

    </main>

    <!-- APPLICATION LOGIC & STATE -->
    <script>
        // --- APP STATE ---
        let state = {
            currentTab: 'inventario',
            darkMode: true,
            currentUserRole: null, // 'admin' | 'observer'
            inventario: [],
            movimientos: [],
            pedidos: [],
            informesGuardados: [],
            evidenciasFacturas: []
        };

        let pendingParsedRows = null;
        let invSearch = '';
        let invCategory = 'Todas';

        // --- INIT APP ---
        window.onload = function() {
            loadState();
            updateDailyDate();
            setInterval(updateDailyDate, 60000);
            checkAuth();
            applyTheme();
        };

        // --- SISTEMA DE AUTENTICACIÓN Y ROLES ---
        function checkAuth() {
            const overlay = document.getElementById('auth-overlay');
            if (!state.currentUserRole) {
                if (overlay) overlay.classList.remove('hidden');
            } else {
                if (overlay) overlay.classList.add('hidden');
                updateUserUI();
            }
        }

        function handleAuthLogin(e) {
            e.preventDefault();
            const pin = document.getElementById('auth-pin-input').value.trim();
            const overlay = document.getElementById('auth-overlay');

            if (pin === '2626') {
                state.currentUserRole = 'admin';
                showToast("Acceso como Administrador", "success");
            } else if (pin === '123') {
                state.currentUserRole = 'observer';
                showToast("Acceso como Observador (Solo Lectura)", "success");
            } else {
                showToast("PIN incorrecto. Intenta nuevamente.", "error");
                return;
            }

            document.getElementById('auth-pin-input').value = '';
            if (overlay) overlay.classList.add('hidden');
            saveState();
            updateUserUI();
            renderView();
        }

        function logoutAuth() {
            state.currentUserRole = null;
            saveState();
            const overlay = document.getElementById('auth-overlay');
            if (overlay) overlay.classList.remove('hidden');
        }

        function updateUserUI() {
            const userName = document.getElementById('user-name');
            const userRole = document.getElementById('user-role');
            const userAvatar = document.getElementById('user-avatar');
            const btnTopExcel = document.getElementById('btn-top-excel');
            const btnTopAddProduct = document.getElementById('btn-top-add-product');
            const navCargaMasiva = document.getElementById('nav-cargamasiva');

            if (state.currentUserRole === 'admin') {
                if (userName) userName.innerText = "Wendy Hernandez";
                if (userAvatar) userAvatar.innerText = "WH";
                if (userRole) userRole.innerHTML = `<i class="fa-solid fa-shield-halved text-[10px]"></i><span>Administrador</span>`;
                if (btnTopExcel) btnTopExcel.style.display = 'flex';
                if (btnTopAddProduct) btnTopAddProduct.style.display = 'flex';
                if (navCargaMasiva) navCargaMasiva.style.display = 'flex';
            } else {
                if (userName) userName.innerText = "Usuario Observador";
                if (userAvatar) userAvatar.innerText = "OB";
                if (userRole) userRole.innerHTML = `<i class="fa-solid fa-eye text-[10px]"></i><span>Solo Lectura</span>`;
                if (btnTopExcel) btnTopExcel.style.display = 'none';
                if (btnTopAddProduct) btnTopAddProduct.style.display = 'none';
                if (navCargaMasiva) navCargaMasiva.style.display = 'none';
            }
        }

        function updateDailyDate() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const formatted = now.toLocaleDateString('es-ES', options);
            const headerDate = document.getElementById('current-date-header');
            if (headerDate) headerDate.innerText = formatted;
        }

        function loadState() {
            const saved = localStorage.getItem('jadever_bodega_v4');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed };
                } catch(e) { console.error("Error loading local storage", e); }
            }
            updateBadges();
            renderView();
        }

        function saveState() {
            localStorage.setItem('jadever_bodega_v4', JSON.stringify({
                inventario: state.inventario,
                movimientos: state.movimientos,
                pedidos: state.pedidos,
                informesGuardados: state.informesGuardados,
                evidenciasFacturas: state.evidenciasFacturas,
                darkMode: state.darkMode,
                currentUserRole: state.currentUserRole
            }));
            updateBadges();
        }

        function updateBadges() {
            const badge = document.getElementById('badge-inventario');
            if (badge) {
                badge.innerText = state.inventario.length;
            }
        }

        // --- MODO CLARO / OSCURO FUNCIONAL EN TODA LA APLICACIÓN ---
        function toggleTheme() {
            state.darkMode = !state.darkMode;
            applyTheme();
            saveState();
        }

        function applyTheme() {
            const html = document.documentElement;
            const body = document.getElementById('app-body');
            const main = document.getElementById('app-main');
            const sidebar = document.getElementById('sidebar');
            const topHeader = document.getElementById('top-header');
            const logoTitle = document.getElementById('logo-title');
            const userName = document.getElementById('user-name');
            const themeCard = document.getElementById('theme-card');
            const themeLabelBox = document.getElementById('theme-label-box');
            const themeIcon = document.getElementById('theme-icon');
            const themeText = document.getElementById('theme-text');

            if (state.darkMode) {
                html.classList.add('dark');
                html.classList.remove('light');
                body.className = "bg-gray-900 text-gray-100 flex h-screen overflow-hidden";
                main.className = "flex-1 flex flex-col h-screen overflow-hidden bg-gray-900";
                sidebar.className = "w-64 bg-gray-950 border-r border-gray-800 flex flex-col transition-all duration-300 z-30 shadow-xl";
                topHeader.className = "h-16 bg-gray-950 border-b border-gray-800 px-6 flex items-center justify-between z-20 text-white";
                if (logoTitle) logoTitle.className = "font-bold text-base tracking-tight text-white leading-tight";
                if (userName) userName.className = "text-sm font-semibold text-white truncate";
                if (themeCard) themeCard.className = "flex items-center justify-between bg-gray-900 border border-gray-800 p-2.5 rounded-xl";
                if (themeLabelBox) themeLabelBox.className = "flex items-center space-x-2 text-xs font-medium text-gray-300";
                if (themeIcon) themeIcon.className = "fa-solid fa-moon text-amber-500";
                if (themeText) themeText.innerText = "Modo Oscuro";
            } else {
                html.classList.remove('dark');
                html.classList.add('light');
                body.className = "bg-gray-100 text-gray-800 flex h-screen overflow-hidden";
                main.className = "flex-1 flex flex-col h-screen overflow-hidden bg-gray-100";
                sidebar.className = "w-64 bg-white border-r border-gray-200 flex flex-col transition-all duration-300 z-30 shadow-xl text-gray-800";
                topHeader.className = "h-16 bg-white border-b border-gray-200 px-6 flex items-center justify-between z-20 text-gray-800";
                if (logoTitle) logoTitle.className = "font-bold text-base tracking-tight text-gray-900 leading-tight";
                if (userName) userName.className = "text-sm font-semibold text-gray-900 truncate";
                if (themeCard) themeCard.className = "flex items-center justify-between bg-gray-50 border border-gray-200 p-2.5 rounded-xl";
                if (themeLabelBox) themeLabelBox.className = "flex items-center space-x-2 text-xs font-medium text-gray-700";
                if (themeIcon) themeIcon.className = "fa-solid fa-sun text-amber-500";
                if (themeText) themeText.innerText = "Modo Claro";
            }
            renderView();
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `flex items-center space-x-3 px-4 py-3 rounded-xl shadow-2xl text-sm font-medium text-white transition-all transform translate-y-2 opacity-0 ${
                type === 'success' ? 'bg-emerald-600 border border-emerald-500' : 'bg-red-600 border border-red-500'
            }`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function switchTab(tab) {
            state.currentTab = tab;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.className = `nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-sm font-medium ${state.darkMode ? 'text-gray-400 hover:bg-gray-800/50 hover:text-white' : 'text-gray-600 hover:bg-gray-100 hover:text-gray-900'} transition-colors`;
            });
            const activeBtn = document.getElementById(`nav-${tab}`);
            if (activeBtn) {
                activeBtn.className = "nav-btn w-full flex items-center justify-between px-3.5 py-3 rounded-xl text-sm font-medium transition-colors bg-amber-600 text-white shadow-md";
            }
            renderView();
        }

        function openModalHTML(htmlContent) {
            const container = document.getElementById('global-modal');
            container.innerHTML = htmlContent;
            container.classList.remove('hidden');
        }

        function closeModal() {
            const container = document.getElementById('global-modal');
            container.classList.add('hidden');
            container.innerHTML = '';
        }

        function renderView() {
            const container = document.getElementById('main-content-view');
            if (!container) return;
            container.innerHTML = '';
            switch(state.currentTab) {
                case 'inventario': renderInventario(container); break;
                case 'movimientos': renderMovimientos(container); break;
                case 'pedidos': renderPedidos(container); break;
                case 'informes': renderInformes(container); break;
                case 'mas': renderMas(container); break;
                case 'cargamasiva': renderCargaMasiva(container); break;
            }
            updateBadges();
            updateUserUI();
        }

        // ================= 1. INVENTARIO =================
        function renderInventario(container) {
            const isAdmin = state.currentUserRole === 'admin';
            const totalRef = state.inventario.length;
            const totalUnits = state.inventario.reduce((acc, item) => acc + (Number(item.cantidad) || 0), 0);
            const reorderAlerts = state.inventario.filter(item => Number(item.cantidad) <= Number(item.minimo)).length;
            const totalMovimientos = state.movimientos.length;

            const categories = ['Todas', 'Adhesivos y sellantes', 'Aire y ventilación', 'Automotriz', 'Cerrajería y seguridad', 'Construcción', 'Electricidad'];

            const filteredItems = state.inventario.filter(item => {
                const matchSearch = item.nombre.toLowerCase().includes(invSearch.toLowerCase()) || item.sku.toLowerCase().includes(invSearch.toLowerCase()) || item.ubicacion.toLowerCase().includes(invSearch.toLowerCase());
                const matchCat = invCategory === 'Todas' || item.categoria === invCategory;
                return matchSearch && matchCat;
            });

            const cardBg = state.darkMode ? 'bg-gray-950 border-gray-800' : 'bg-white border-gray-200 text-gray-800 shadow-sm';
            const tableHeaderBg = state.darkMode ? 'bg-gray-900/50 text-gray-400' : 'bg-gray-100 text-gray-600';
            const tableRowHover = state.darkMode ? 'hover:bg-gray-900/40' : 'hover:bg-gray-50';

            container.innerHTML = `
                <!-- Metric Cards -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="${cardBg} border p-5 rounded-2xl flex items-center justify-between">
                        <div>
                            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Total Referencias (SKU)</p>
                            <h3 class="text-2xl font-bold ${state.darkMode ? 'text-white' : 'text-gray-900'} mt-1">${totalRef}</h3>
                        </div>
                        <div class="w-12 h-12 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center text-lg">
                            <i class="fa-solid fa-boxes-stacked"></i>
                        </div>
                    </div>
                    <div class="${cardBg} border p-5 rounded-2xl flex items-center justify-between">
                        <div>
                            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Unidades Totales en Stock</p>
                            <h3 class="text-2xl font-bold ${state.darkMode ? 'text-white' : 'text-gray-900'} mt-1">${totalUnits.toLocaleString('es-ES')} un.</h3>
                        </div>
                        <div class="w-12 h-12 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-lg">
                            <i class="fa-solid fa-cubes"></i>
                        </div>
                    </div>
                    <div class="${cardBg} border p-5 rounded-2xl flex items-center justify-between">
                        <div>
                            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Alertas de Reorden</p>
                            <h3 class="text-2xl font-bold text-amber-500 mt-1">${reorderAlerts}</h3>
                        </div>
                        <div class="w-12 h-12 rounded-xl bg-amber-500/10 text-amber-500 flex items-center justify-center text-lg">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>
                    </div>
                    <div class="${cardBg} border p-5 rounded-2xl flex items-center justify-between">
                        <div>
                            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Movimientos Registrados</p>
                            <h3 class="text-2xl font-bold text-purple-400 mt-1">${totalMovimientos}</h3>
                        </div>
                        <div class="w-12 h-12 rounded-xl bg-purple-500/10 text-purple-400 flex items-center justify-center text-lg">
                            <i class="fa-solid fa-bolt"></i>
                        </div>
                    </div>
                </div>

                <!-- Search & Filters -->
                <div class="${cardBg} border rounded-2xl p-5 space-y-4">
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400"></i>

                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Categoría</label>

                                <option value="Construcción">Construcción</option>
                                <option value="Adhesivos y sellantes">Adhesivos y sellantes</option>
                                <option value="Aire y ventilación">Aire y ventilación</option>

                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">

                            Crear Producto
                        </button>
                    </form>
                </div>
            `);

        function handleAddProduct(e) {
            e.preventDefault();
            const sku = document.getElementById('add-sku').value.trim();
            const nombre = document.getElementById('add-name').value.trim();
            const categoria = document.getElementById('add-cat').value;
            const ubicacion = document.getElementById('add-ub').value.trim();
            const cantidad = Number(document.getElementById('add-cant').value);
            const minimo = Number(document.getElementById('add-min').value);
            const precio = Number(document.getElementById('add-precio').value);

            if (state.inventario.some(i => i.sku.toLowerCase() === sku.toLowerCase())) {
                showToast("El SKU ya existe en el inventario", "error");
                return;
            }

            state.inventario.push({ sku, nombre, categoria, ubicacion, cantidad, minimo, precio });
            saveState();
            closeModal();
            renderView();
            showToast("Producto agregado exitosamente", "success");
        }

        function openEditProductModal(sku) {
            const item = state.inventario.find(i => i.sku === sku);
            if (!item) return;

            openModalHTML(`
                <div class="${state.darkMode ? 'bg-gray-950 border-gray-800' : 'bg-white border-gray-200'} border rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">

                        </div>
                        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-gray-800 text-gray-400 hover:text-white flex items-center justify-center">

                    </div>
                    <form onsubmit="handleUpdateProduct(event, '${item.sku}')" class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Nombre del Producto</label>
                            <input type="text" id="edit-name" value="${item.nombre}" required class="w-full ${state.darkMode ? 'bg-gray-900 border-gray-800 text-white' : 'bg-gray-50 border-gray-300 text-gray-900'} border rounded-xl px-3.5 py-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Categoría</label>
                            <select id="edit-cat" class="w-full ${state.darkMode ? 'bg-gray-900 border-gray-800 text-white' : 'bg-gray-50 border-gray-300 text-gray-900'} border rounded-xl px-3.5 py-2 text-sm">
                                ${['Adhesivos y sellantes', 'Aire y ventilación', 'Automotriz', 'Cerrajería y seguridad', 'Construcción', 'Electricidad'].map(cat => `<option value="${cat}" ${item.categoria === cat ? 'selected' : ''}>${cat}</option>`).join('')}
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-400 mb-1">Ubicación</label>
                                <input type="text" id="edit-ub" value="${item.ubicacion}" required class="w-full ${state.darkMode ? 'bg-gray-900 border-gray-800 text-white' : 'bg-gray-50 border-gray-300 text-gray-900'} border rounded-xl px-3.5 py-2 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-400 mb-1">Stock Actual</label>
                                <input type="number" id="edit-cant" min="0" value="${item.cantidad}" required class="w-full ${state.darkMode ? 'bg-gray-900 border-gray-800 text-white' : 'bg-gray-50 border-gray-300 text-gray-900'} border rounded-xl px-3.5 py-2 text-sm">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-400 mb-1">Stock Mínimo (Alerta)</label>
                                <input type="number" id="edit-min" min="1" value="${item.minimo || 3}" required class="w-full ${state.darkMode ? 'bg-gray-900 border-gray-800 text-white' : 'bg-gray-50 border-gray-300 text-gray-900'} border rounded-xl px-3.5 py-2 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-400 mb-1">Precio Unitario ($)</label>
                                <input type="number" step="0.01" id="edit-precio" min="0" value="${item.precio || 0}" required class="w-full ${state.darkMode ? 'bg-gray-900 border-gray-800 text-white' : 'bg-gray-50 border-gray-300 text-gray-900'} border rounded-xl px-3.5 py-2 text-sm">
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-semibold py-3 rounded-xl text-sm transition shadow-lg">
                            Guardar Cambios
                        </button>
                    </form>
                </div>
            `);

        function handleUpdateProduct(e, sku) {
            e.preventDefault();
            const item = state.inventario.find(i => i.sku === sku);
            if (!item) return;

            item.nombre = document.getElementById('edit-name').value;
            item.categoria = document.getElementById('edit-cat').value;
            item.ubicacion = document.getElementById('edit-ub').value;
            item.cantidad = Number(document.getElementById('edit-cant').value);
            item.minimo = Number(document.getElementById('edit-min').value);
            item.precio = Number(document.getElementById('edit-precio').value);

            saveState();
            closeModal();
            renderView();
            showToast("Producto actualizado correctamente", "success");
        }

        function deleteProduct(sku) {
            if (confirm(`¿Deseas eliminar el producto ${sku} del inventario?`)) {
                state.inventario = state.inventario.filter(i => i.sku !== sku);
                saveState();
                renderView();
                showToast("Producto eliminado", "success");
            }
        }

        function readImageFile(input, callback) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => callback(e.target.result);
                reader.readAsDataURL(input.files[0]);
            }
        }

        function handleSaveMove(e, tipo) {
            e.preventDefault();
            const sku = document.getElementById('move-sku').value;
            if (!sku) {
                showToast("Agrega un producto al inventario primero", "error");
                return;
            }
            const cliente = document.getElementById('move-cliente').value.trim();
            const cant = Number(document.getElementById('move-cant').value);
            const resp = document.getElementById('move-resp').value;
            const item = state.inventario.find(i => i.sku === sku);

            if (!item) return;

            if (tipo === 'Salida' && item.cantidad < cant) {
                showToast(`Stock insuficiente. Solo hay ${item.cantidad} disponibles.`, "error");
                return;
            }

            if (tipo === 'Salida') {
                item.cantidad -= cant;
            } else {
                item.cantidad += cant;
            }

            const now = new Date();
            const fechaStr = now.toLocaleDateString('es-ES') + ' ' + now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

            state.movimientos.unshift({
                id: 'MOV-' + Math.floor(100 + Math.random()*900),
                tipo,
                sku,
                producto: item.nombre,
                cantidad: cant,
                fecha: fechaStr,
                responsable: resp,
                clienteFactura: cliente,
                fotoEvidencia: window.tmpMoveImg || null
            });

            window.tmpMoveImg = null;
            saveState();
            closeModal();
            renderView();
            showToast(`${tipo} registrada con éxito`, "success");
        }

                                <td style="padding: 10px 12px; font-weight: 700; text-transform: uppercase; color: ${m.tipo === 'Entrada' ? '#059669' : '#d97706'};">${m.tipo}</td>
                                <td style="padding: 10px 12px; font-family: monospace; font-weight: 700; color: #ea580c;">${m.sku}</td>
                                <td style="padding: 10px 12px; font-weight: 600; color: #111827;">${m.producto}</td>
                                <td style="padding: 10px 12px; text-align: center; font-weight: 700;">${m.cantidad}</td>
                                <td style="padding: 10px 12px; color: #4b5563;">${m.responsable}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            document.body.appendChild(printElement);

            const opt = {
                margin:       10,
                filename:     `informe-${todayStr}_${todayStr}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, backgroundColor: '#ffffff' },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            if (typeof html2pdf !== 'undefined') {
                html2pdf().set(opt).from(printElement).save().then(() => {
                    document.body.removeChild(printElement);
                });
            } else {
                document.body.removeChild(printElement);
                window.print();
            }
        }

        function sendByEmail() {
            const mailto = `mailto:?subject=Informe%20JadeverBodega&body=Adjunto%20resumen%20de%20movimientos%20e%20inventario.`;
            window.location.href = mailto;
        }

        function exportReportCSV() {
            let csv = "Fecha,Tipo,SKU,Producto,Cliente_Factura,Cantidad,Responsable\n";
            state.movimientos.forEach(m => {
                csv += `"${m.fecha}","${m.tipo}","${m.sku}","${m.producto}","${m.clienteFactura || ''}",${m.cantidad},"${m.responsable}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `Reporte_Movimientos_${Date.now()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // ================= 5. MÁS / CONFIGURACIÓN =================
        function renderMas(container) {
            const isAdmin = state.currentUserRole === 'admin';
            const cardBg = state.darkMode ? 'bg-gray-950 border-gray-800' : 'bg-white border-gray-200 text-gray-800 shadow-sm';

            container.innerHTML = `
                <div class="max-w-xl mx-auto ${cardBg} border rounded-2xl p-6 space-y-6">
                    <h3 class="font-bold text-base ${state.darkMode ? 'text-white' : 'text-gray-900'}">Configuración del Sistema</h3>
                    
                    <div class="space-y-4">
                        <div class="flex items-center justify-between border-b ${state.darkMode ? 'border-gray-800' : 'border-gray-200'} pb-3">
                            <div>
                                <h4 class="text-sm font-semibold">Tema Visual</h4>
                                <p class="text-xs text-gray-400">Alternar entre modo claro y oscuro</p>
                            </div>
                            <button onclick="toggleTheme()" class="px-4 py-2 bg-amber-600 text-white rounded-xl text-xs font-semibold">
                                Cambiar Modo
                            </button>
                        </div>

                        <div class="flex items-center justify-between border-b ${state.darkMode ? 'border-gray-800' : 'border-gray-200'} pb-3">
                            <div>
                                <h4 class="text-sm font-semibold">Copia de Seguridad</h4>
                                <p class="text-xs text-gray-400">Descargar datos en CSV</p>
                            </div>
                            <button onclick="exportReportCSV()" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-semibold">
                                Exportar CSV
                            </button>
                        </div>

                        ${isAdmin ? `
                            <div class="flex items-center justify-between pb-2">
                                <div>
                                    <h4 class="text-sm font-semibold text-red-400">Reiniciar Datos (Poner en 0)</h4>
                                    <p class="text-xs text-gray-400">Restablecer la aplicación a 0 todo el sistema</p>
                                </div>
                                <button onclick="resetAllData()" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs font-semibold">
                                    Limpiar todo a 0
                                </button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function resetAllData() {
            if (confirm("¿Estás seguro de que deseas borrar todos los datos y dejar todo en 0?")) {
                localStorage.removeItem('jadever_bodega_v4');
                state.inventario = [];
                state.movimientos = [];
                state.pedidos = [];
                state.informesGuardados = [];
                state.evidenciasFacturas = [];
                saveState();
                renderView();
                showToast("Sistema restablecido completamente a 0", "success");
            }
        }

        // ================= 6. CARGA MASIVA EXCEL =================
        function renderCargaMasiva(container) {
            const cardBg = state.darkMode ? 'bg-gray-950 border-gray-800' : 'bg-white border-gray-200 text-gray-800';

            container.innerHTML = `
                <div class="max-w-3xl mx-auto space-y-6">
                    <div class="${cardBg} border rounded-2xl p-8 text-center space-y-6">
                        <div class="w-16 h-16 bg-emerald-500/10 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto text-2xl border border-emerald-500/20">
                            <i class="fa-solid fa-file-excel"></i>
                        </div>
                        <div class="space-y-2">
                            <h2 class="text-xl font-bold ${state.darkMode ? 'text-white' : 'text-gray-900'}">Importación de Archivos Excel (.xlsx / .csv)</h2>
                            <p class="text-xs text-gray-400">Carga tu lista de productos masivamente. El sistema leerá todas las columnas (SKU, Producto, Categoría, Ubicación, Cantidad, Mínimo, Precio).</p>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-left pt-2">
                            <div class="p-4 rounded-xl border border-amber-500/30 bg-amber-500/10 space-y-2">
                                <div class="flex items-center space-x-2 text-amber-500 font-bold text-sm">
                                    <i class="fa-solid fa-arrows-rotate"></i>
                                    <span>Modo: Actualizar / Fusionar</span>
                                </div>
                                <p class="text-xs ${state.darkMode ? 'text-gray-300' : 'text-gray-600'}">Conserva los productos actuales. Si el SKU ya existe, le <strong>suma la nueva cantidad</strong> y actualiza datos. Los productos nuevos se añaden.</p>
                            </div>

                            <div class="p-4 rounded-xl border border-red-500/30 bg-red-500/10 space-y-2">
                                <div class="flex items-center space-x-2 text-red-400 font-bold text-sm">
                                    <i class="fa-solid fa-trash-can"></i>
                                    <span>Modo: Subir y Reemplazar Todo</span>
                                </div>
                                <p class="text-xs ${state.darkMode ? 'text-gray-300' : 'text-gray-600'}">Borra <strong>todo el inventario existente</strong> y lo sustituye completamente con los datos que vienen en este documento.</p>
                            </div>
                        </div>

                        <div class="border-2 border-dashed ${state.darkMode ? 'border-gray-800 bg-gray-900/40' : 'border-gray-300 bg-gray-50'} hover:border-amber-500 rounded-2xl p-8 relative transition">
                            <input type="file" id="excel-file-input" accept=".xlsx, .xls, .csv" onchange="handleExcelSelect(this)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
                            <div class="space-y-3 pointer-events-none">
                                <i class="fa-solid fa-cloud-arrow-up text-4xl text-amber-500"></i>
                                <div class="text-base font-semibold ${state.darkMode ? 'text-white' : 'text-gray-800'}">Haz clic aquí o arrastra tu archivo Excel / CSV</div>
                                <p class="text-xs text-gray-500">Formato compatible: .xlsx, .xls, .csv</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleExcelSelect(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheetName = workbook.SheetNames[0];
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: "" });

                    if (rows.length === 0) {
                        showToast("El archivo de Excel está vacío o no se reconocieron filas", "error");
                        return;
                    }

                    pendingParsedRows = rows;
                    openUploadOptionsModal(file.name, rows.length);
                } catch(err) {
                    showToast("Error al leer la hoja de Excel. Verifica el formato.", "error");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function openUploadOptionsModal(fileName, totalItems) {
            openModalHTML(`
                <div class="${state.darkMode ? 'bg-gray-950 border-gray-800' : 'bg-white border-gray-200'} border rounded-2xl max-w-lg w-full p-6 space-y-5 shadow-2xl">
                    <div class="flex items-center justify-between border-b ${state.darkMode ? 'border-gray-800' : 'border-gray-200'} pb-3">
                        <div>
                            <h3 class="font-bold ${state.darkMode ? 'text-white' : 'text-gray-900'} text-base">¿Cómo deseas procesar este Excel?</h3>
                            <p class="text-xs text-amber-500 font-semibold">${fileName} — ${totalItems} registros leídos</p>
                        </div>
                        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-gray-800 text-gray-400 hover:text-white flex items-center justify-center">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <p class="text-xs ${state.darkMode ? 'text-gray-300' : 'text-gray-700'} leading-relaxed">
                        Selecciona el modo de importación haciendo clic en una de las dos opciones:
                    </p>

                    <div class="space-y-3">
                        <button onclick="processExcelImport('update')" class="w-full flex items-start space-x-3 p-4 rounded-xl border border-amber-500/40 bg-amber-500/10 hover:bg-amber-500/20 text-left transition group">
                            <div class="w-10 h-10 rounded-lg bg-amber-500/20 text-amber-500 flex items-center justify-center font-bold shrink-0 mt-0.5">
                                <i class="fa-solid fa-arrows-rotate text-lg"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-sm text-amber-500 group-hover:underline">1. Actualizar y Fusionar (Recomendado)</h4>
                                <p class="text-xs ${state.darkMode ? 'text-gray-400' : 'text-gray-600'} mt-1">Suma las cantidades del archivo al inventario existente si coincide el SKU. Agrega productos nuevos sin borrar nada del catálogo actual.</p>
                            </div>
                        </button>

                        <button onclick="processExcelImport('replace')" class="w-full flex items-start space-x-3 p-4 rounded-xl border border-red-500/40 bg-red-500/10 hover:bg-red-500/20 text-left transition group">
                            <div class="w-10 h-10 rounded-lg bg-red-500/20 text-red-400 flex items-center justify-center font-bold shrink-0 mt-0.5">
                                <i class="fa-solid fa-trash-can text-lg"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-sm text-red-400 group-hover:underline">2. Subir y Reemplazar Todo</h4>
                                <p class="text-xs ${state.darkMode ? 'text-gray-400' : 'text-gray-600'} mt-1">Limpia por completo la lista actual de productos y la reemplaza 100% con los datos de este documento Excel.</p>
                            </div>
                        </button>
                    </div>
                </div>
            `);
        }

        function processExcelImport(mode) {
            if (!pendingParsedRows) return;
            
            if (mode === 'replace') {
                state.inventario = [];
            }

            let added = 0, updated = 0;

            pendingParsedRows.forEach(r => {
                const sku = String(r.SKU || r.sku || r.Codigo || r.CODIGO || r.Ref || 'JD-' + Math.floor(1000 + Math.random()*9000)).trim();
                const nombre = String(r.PRODUCTO || r.Producto || r.producto || r.Nombre || r.NOMBRE || 'Producto sin nombre').trim();
                const categoria = String(r.CATEGORIA || r.Categoria || r.categoria || 'Construcción').trim();
                const ubicacion = String(r.UBICACION || r.Ubicacion || r.ubicacion || 'Bodega').trim();
                const cantidad = Number(r.CANTIDAD || r.Cantidad || r.cantidad || r.Stock || r.STOCK || 0);
                const minimo = Number(r.MINIMO || r.Minimo || r.minimo || 3);
                const precio = Number(r.PRECIO || r.Precio || r.precio || 0.00);

                const idx = state.inventario.findIndex(i => i.sku.toLowerCase() === sku.toLowerCase());
                if (idx !== -1) {
                    state.inventario[idx].cantidad += cantidad;
                    if (r.UBICACION || r.Ubicacion) state.inventario[idx].ubicacion = ubicacion;
                    if (r.PRECIO || r.Precio) state.inventario[idx].precio = precio;
                    if (r.PRODUCTO || r.Producto) state.inventario[idx].nombre = nombre;
                    updated++;
                } else {
                    state.inventario.push({ sku, nombre, categoria, ubicacion, cantidad, minimo, precio });
                    added++;
                }
            });

            state.inventario.sort((a,b) => a.sku.localeCompare(b.sku));
            pendingParsedRows = null;
            saveState();
            closeModal();
            switchTab('inventario');
            showToast(mode === 'replace' ? `Inventario reemplazado completamente (${added} productos cargados)` : `Excel fusionado: ${added} creados, ${updated} actualizados`, "success");
        }
    </script>
</body>
</html>
