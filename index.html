  <!-- Firebase SDKs (Modular v10) con Auth y Firestore -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, addDoc, setDoc, doc, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB4hiDPrruHiul8HHoH_gdbFVX5nU0vOgM",
      authDomain: "jadeverbodega.firebaseapp.com",
      projectId: "jadeverbodega",
      storageBucket: "jadeverbodega.firebasestorage.app",
      messagingSenderId: "801005563673",
      appId: "1:801005563673:web:01ad1465257cf9e9b3df88"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    window.firebaseAuth = auth;
    window.googleProvider = provider;
    window.signInWithPopup = signInWithPopup;
    window.signOut = signOut;
    window.db = db;
    window.firebaseEnabled = true;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.loggedInUser = user;
        unlockApp(user.displayName || user.email, "Administrador (Google)");
      }
    });
  </script>
