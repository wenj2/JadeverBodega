        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.firebaseModules = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken,
            getFirestore, doc, setDoc, getDoc, onSnapshot, collection
        };
        window.dispatchEvent(new Event('firebase-loaded'));
    </script>

    <!-- APPLICATION LOGIC & STATE -->
    <script>
        let state = {
            currentTab: 'inventario',
            darkMode: false,
            sidebarCollapsed: false,
            currentUserRole: null,
            lastLoginTime: null,
            inventario: [],
            movimientos: [],
            pedidos: [],
            informesGuardados: [],
            evidenciasFacturas: []
        };

        let db = null;
        let auth = null;
        let unsubscribeFirestore = null;
        let isSyncingFromCloud = false;

        let pendingParsedRows = null;
        let invSearch = '';
        let invCategory = 'Todas';

        const defaultCategories = [
            'Herramientas Manuales',
            'Herramientas Eléctricas',
            'Fijación y Tornillería',
            'Fontanería y Plomería',
            'Pinturas y Acabados',
            'Seguridad e Iluminación',
            'Construcción y Medición'
        ];

        window.addEventListener('firebase-loaded', async () => {
            try {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'jadever-bodega-default';
                const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
                    apiKey: "AIzaSyB4hiDPrrUhiu8HHoH_gdbFVX5nU0vOgM",
                    authDomain: "jadever-bodega.firebaseapp.com",
                    projectId: "jadeverbodega",
                    storageBucket: "jadeverbodega.appspot.com",
                    messagingSenderId: "801005563673",
                    appId: "1:801005563673:web:01ad1465257cf9e9b3df88"
                };

                const app = window.firebaseModules.initializeApp(firebaseConfig);
                db = window.firebaseModules.getFirestore(app);
                auth = window.firebaseModules.getAuth(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await window.firebaseModules.signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await window.firebaseModules.signInAnonymously(auth);
                }

                initRealtimeSync(appId);
            } catch(e) {
                setSyncStatus(false, "Modo Local");
                loadStateLocal();
            }
        });

        function setSyncStatus(isOnline, text) {
            const dot = document.getElementById('sync-dot');
            const txt = document.getElementById('sync-text');
            if (!dot || !txt) return;
            if (isOnline) {
                dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-lg shadow-emerald-500/50";
                txt.innerText = text || "Sincronizado con Cloud";
            } else {
                dot.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
                txt.innerText = text || "Trabajando Local";
            }
        }

        function initRealtimeSync(appId) {
            if (!db || !auth) return;
            const userId = auth.currentUser ? auth.currentUser.uid : 'default-user';
            const docRef = window.firebaseModules.doc(db, 'artifacts', appId, 'users', userId);

            if (unsubscribeFirestore) unsubscribeFirestore();

            unsubscribeFirestore = window.firebaseModules.onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const cloudData = docSnap.data();
                    if (cloudData && cloudData.payload) {
                        isSyncingFromCloud = true;
                        try {
                            const parsed = JSON.parse(cloudData.payload);
                            state = { ...state, ...parsed };
                            updateBadges();
                            checkAuthSessionValidity();
                            renderView();
                            setSyncStatus(true, "Sincronizado con Cloud");
                        } catch(err) {
                            console.error("Error parsing cloud state", err);
                        }
                        isSyncingFromCloud = false;
                    }
                } else {
                    saveState();
                }
            }, (error) => {
                setSyncStatus(false, "Sin conexión Cloud");
                loadStateLocal();
            });
        }

        function toggleSidebar() {
            state.sidebarCollapsed = !state.sidebarCollapsed;
            applySidebarState();
        }

        function applySidebarState() {
            const sidebar = document.getElementById('sidebar');
            const texts = document.querySelectorAll('.sidebar-text');
            if (state.sidebarCollapsed) {
                sidebar.classList.remove('w-64');
                sidebar.classList.add('w-20');
                texts.forEach(el => el.classList.add('hidden'));
            } else {
                sidebar.classList.remove('w-20');
                sidebar.classList.add('w-64');
                texts.forEach(el => el.classList.remove('hidden'));
            }
        }

        function suggestCategoryByName(name) {
            const n = name.toLowerCase();
            if (n.includes('taladro') || n.includes('esmeril') || n.includes('sierra')) return 'Herramientas Eléctricas';
            if (n.includes('llave') || n.includes('destornillador') || n.includes('martillo')) return 'Herramientas Manuales';
            if (n.includes('tornillo') || n.includes('clavo') || n.includes('tuerca')) return 'Fijación y Tornillería';
            if (n.includes('tubo') || n.includes('codo') || n.includes('valvula')) return 'Fontanería y Plomería';
            if (n.includes('pintura') || n.includes('brocha') || n.includes('silicona')) return 'Pinturas y Acabados';
            if (n.includes('casco') || n.includes('guante') || n.includes('foco')) return 'Seguridad e Iluminación';
            if (n.includes('automotriz') || n.includes('aceite') || n.includes('filtro')) return 'Automotriz';
            return 'Construcción y Medición';
        }

        function handleAuthLogin(e) {
            e.preventDefault();
            const pin = document.getElementById('auth-pin-input').value.trim();
            const overlay = document.getElementById('auth-overlay');

            if (pin === '2626') {
                state.currentUserRole = 'admin';
                state.lastLoginTime = Date.now();
                showToast("Acceso como Administrador", "success");
            } else if (pin === '123') {
                state.currentUserRole = 'observer';
                state.lastLoginTime = Date.now();
                showToast("Acceso como Observador (Solo Lectura)", "success");
            } else {
                showToast("PIN incorrecto. Intenta nuevamente.", "error");
                return;
            }

            document.getElementById('auth-pin-input').value = '';
            if (overlay) overlay.classList.add('hidden');
            saveState();
            updateUserUI();
            renderView();
        }

        function checkAuthSessionValidity() {
            const overlay = document.getElementById('auth-overlay');
            const TWELVE_HOURS_MS = 12 * 60 * 60 * 1000;

            if (state.currentUserRole && state.lastLoginTime) {
                const now = Date.now();
                const elapsed = now - state.lastLoginTime;

                if (elapsed < TWELVE_HOURS_MS) {
                    if (overlay) overlay.classList.add('hidden');
                    updateUserUI();
                    return true;
                } else {
                    state.currentUserRole = null;
                    state.lastLoginTime = null;
                    saveState();
                    showToast("Tu sesión de 12 horas ha expirado. Ingresa tu PIN nuevamente.", "error");
                }
            }

            if (overlay) overlay.classList.remove('hidden');
            return false;
        }

        function logoutAuth() {
            state.currentUserRole = null;
            state.lastLoginTime = null;
            saveState();
            const overlay = document.getElementById('auth-overlay');
            if (overlay) overlay.classList.remove('hidden');
        }

        function updateUserUI() {
            const userName = document.getElementById('user-name');
            const userRole = document.getElementById('user-role');
            const userAvatar = document.getElementById('user-avatar');
            const btnTopExcel = document.getElementById('btn-top-excel');
            const btnTopAddProduct = document.getElementById('btn-top-add-product');
            const navCargaMasiva = document.getElementById('nav-cargamasiva');

            if (state.currentUserRole === 'admin') {
                if (userName) userName.innerText = "Wendy Hernandez";
                if (userAvatar) userAvatar.innerText = "WH";
                if (userRole) userRole.innerHTML = `<i class="fa-solid fa-shield-halved text-[10px]"></i><span>Administrador</span>`;
                if (btnTopExcel) btnTopExcel.style.display = 'flex';
                if (btnTopAddProduct) btnTopAddProduct.style.display = 'flex';
                if (navCargaMasiva) navCargaMasiva.style.display = 'flex';
            } else {
                if (userName) userName.innerText = "Usuario Observador";
                if (userAvatar) userAvatar.innerText = "OB";
                if (userRole) userRole.innerHTML = `<i class="fa-solid fa-eye text-[10px]"></i><span>Solo Lectura</span>`;
                if (btnTopExcel) btnTopExcel.style.display = 'none';
                if (btnTopAddProduct) btnTopAddProduct.style.display = 'none';
                if (navCargaMasiva) navCargaMasiva.style.display = 'none';
            }
        }

        function updateDailyDate() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const formatted = now.toLocaleDateString('es-ES', options);
            const headerDate = document.getElementById('current-date-header');
            if (headerDate) headerDate.innerText = formatted;
        }

        function loadStateLocal() {
            const saved = localStorage.getItem('jadever_bodega_v4');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed };
                } catch(e) { console.error("Error loading local storage", e); }
            } else {
                state.darkMode = false;
            }
            updateBadges();
            checkAuthSessionValidity();
            renderView();
        }

        function saveState() {
            const payloadString = JSON.stringify({
                inventario: state.inventario,
                movimientos: state.movimientos,
                pedidos: state.pedidos,
                informesGuardados: state.informesGuardados,
                evidenciasFacturas: state.evidenciasFacturas,
                darkMode: state.darkMode,
                currentUserRole: state.currentUserRole,
                lastLoginTime: state.lastLoginTime
            });

            localStorage.setItem('jadever_bodega_v4', payloadString);
            updateBadges();

            if (db && auth && !isSyncingFromCloud) {
                const user = auth.currentUser;
                if (!user) return;
                
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'jadever-bodega-default';
                const docRef = window.firebaseModules.doc(db, 'artifacts', appId, 'users', user.uid);
                
                window.firebaseModules.setDoc(docRef, {
                    payload: payloadString,
                    updatedAt: Date.now(),
                    updatedBy: user.uid
                }, { merge: true })
                .then(() => setSyncStatus(true, "Sincronizado con Cloud"))
                .catch(err => setSyncStatus(false, "Error guardando Cloud"));
            }
        }

        window.addEventListener('beforeunload', function() {
            saveState();
        });

        function updateBadges() {
            const badge = document.getElementById('badge-inventario');
            if (badge) {
                badge.innerText = state.inventario.length;
            }
        }

        function toggleTheme() {
            state.darkMode = !state.darkMode;
            applyTheme();
            saveState();
        }

        function applyTheme() {
            const html = document.documentElement;
            const body = document.getElementById('app-body');
            const main = document.getElementById('app-main');
            const sidebar = document.getElementById('sidebar');
            const topHeader = document.getElementById('top-header');
            const logoTitle = document.getElementById('logo-title');
            const userName = document.getElementById('user-name');
            const themeCard = document.getElementById('theme-card');
            const themeLabelBox = document.getElementById('theme-label-box');
            const themeIcon = document.getElementById('theme-icon');
            const themeText = document.getElementById('theme-text');

            if (state.darkMode) {
                html.classList.add('dark');
                html.classList.remove('light');
                body.className = "bg-gray-900 text-gray-100 flex h-screen overflow-hidden";
                main.className = "flex-1 flex flex-col h-screen overflow-hidden bg-gray-900";
                sidebar.className = "w-64 bg-gray-950 border-r border-gray-800 flex flex-col transition-all duration-300 z-30 shadow-xl text-gray-100";

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `flex items-center space-x-3 px-4 py-3 rounded-xl shadow-2xl text-sm font-medium text-white transition-all transform translate-y-2 opacity-0 ${
                type === 'success' ? 'bg-emerald-600 border border-emerald-500' : 'bg-red-600 border border-red-500'
            }`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function switchTab(tab) {
            state.currentTab = tab;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.className = `nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-sm font-medium ${state.darkMode ? 'text-gray-400 hover:bg-gray-800/50 hover:text-white' : 'text-gray-600 hover:bg-gray-100 hover:text-gray-900'} transition-colors`;
            });
            const activeBtn = document.getElementById(`nav-${tab}`);
            if (activeBtn) {
                activeBtn.className = "nav-btn w-full flex items-center justify-between px-3.5 py-3 rounded-xl text-sm font-medium transition-colors bg-amber-600 text-white shadow-md";
            }
            renderView();
        }

        function openModalHTML(htmlContent) {
            const container = document.getElementById('global-modal');
            container.innerHTML = htmlContent;
            container.classList.remove('hidden');
        }

        function closeModal() {
            const container = document.getElementById('global-modal');
            container.classList.add('hidden');
            container.innerHTML = '';
        }

        function renderView() {
            const container = document.getElementById('main-content-view');
            if (!container) return;
            container.innerHTML = '';
            switch(state.currentTab) {
                case 'inventario': renderInventario(container); break;
                case 'movimientos': renderMovimientos(container); break;
                case 'pedidos': renderPedidos(container); break;
                case 'informes': renderInformes(container); break;
                case 'mas': renderMas(container); break;
                case 'cargamasiva': renderCargaMasiva(container); break;
            }
            updateBadges();
            updateUserUI();
        }

        function renderInventario(container) {
            const isAdmin = state.currentUserRole === 'admin';
            const totalRef = state.inventario.length;

                    </div>
                    <div class="${cardBg} border p-5 rounded-2xl flex items-center justify-between">

                    <div class="${cardBg} border p-5 rounded-2xl flex items-center justify-between">

        function openAddProductModal() {
            openModalHTML(`

                    <div class="flex items-center justify-between border-b ${state.darkMode ? 'border-gray-800' : 'border-gray-200'} pb-3">

                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Categoría</label>
                            <select id="add-cat" class="w-full ${state.darkMode ? 'bg-gray-900 border-gray-800 text-white' : 'bg-gray-50 border-gray-300 text-gray-900'} border rounded-xl px-3.5 py-2 text-sm">

                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-400 mb-1">Stock Inicial</label>
                                <input type="number" id="add-cant" min="0" value="1" required class="w-full ${state.darkMode ? 'bg-gray-900 border-gray-800 text-white' : 'bg-gray-50 border-gray-300 text-gray-900'} border rounded-xl px-3.5 py-2 text-sm">
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-semibold py-3 rounded-xl text-sm transition shadow-lg">
                            Crear Producto
                        </button>
                    </form>
                </div>
            `);
        }

        function handleAddProduct(e) {
            e.preventDefault();
            const name = document.getElementById('add-name').value.trim();
            const sku = document.getElementById('add-sku').value.trim();
            const cat = document.getElementById('add-cat').value;
            const ub = document.getElementById('add-ub').value.trim();
            const cant = Number(document.getElementById('add-cant').value) || 0;

            if (state.inventario.some(i => i.sku.toLowerCase() === sku.toLowerCase())) {
                showToast("El SKU ya existe", "error");
                return;
            }

            state.inventario.push({ sku, nombre: name, categoria: cat, ubicacion: ub, cantidad: cant, minimo: 3, precio: 0 });
            saveState();
            closeModal();
            renderView();
            showToast("Producto creado con éxito", "success");
        }

        function openEditProductModal(sku) {
            const item = state.inventario.find(i => i.sku === sku);
            if (!item) return;

            openModalHTML(`
                <div class="${state.darkMode ? 'bg-gray-950 border-gray-800' : 'bg-white border-gray-200'} border rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                    <h3 class="font-bold text-base">Editar Producto (${item.sku})</h3>
                    <form onsubmit="handleSaveEditProduct(event, '${item.sku}')" class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Nombre</label>
                            <input type="text" id="edit-name" value="${item.nombre}" required class="w-full ${state.darkMode ? 'bg-gray-900 border-gray-800 text-white' : 'bg-gray-50 border-gray-300'} border rounded-xl px-3 py-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Ubicación</label>
                            <input type="text" id="edit-ub" value="${item.ubicacion}" required class="w-full ${state.darkMode ? 'bg-gray-900 border-gray-800 text-white' : 'bg-gray-50 border-gray-300'} border rounded-xl px-3 py-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Cantidad</label>
                            <input type="number" id="edit-cant" min="0" value="${item.cantidad}" required class="w-full ${state.darkMode ? 'bg-gray-900 border-gray-800 text-white' : 'bg-gray-50 border-gray-300'} border rounded-xl px-3 py-2 text-sm">
                        </div>
                        <button type="submit" class="w-full bg-amber-600 text-white font-semibold py-3 rounded-xl text-sm">Guardar</button>
                    </form>
                </div>
            `);
        }

        function handleSaveEditProduct(e, sku) {
            e.preventDefault();
            const item = state.inventario.find(i => i.sku === sku);
            if (!item) return;
            item.nombre = document.getElementById('edit-name').value.trim();
            item.ubicacion = document.getElementById('edit-ub').value.trim();
            item.cantidad = Number(document.getElementById('edit-cant').value) || 0;
            saveState();
            closeModal();
            renderView();
            showToast("Actualizado", "success");
        }

        function deleteProduct(sku) {
            if (confirm("¿Eliminar producto?")) {
                state.inventario = state.inventario.filter(i => i.sku !== sku);
                saveState();
                renderView();
                showToast("Eliminado", "success");
            }
        }

                                <thead>
                                    <tr class="border-b ${state.darkMode ? 'border-gray-800 bg-gray-900/50 text-gray-400' : 'border-gray-200 bg-gray-100 text-gray-600'} text-xs font-semibold uppercase">
                                        <th class="py-3 px-4">Fecha</th>
                                        <th class="py-3 px-4">Tipo</th>
                                        <th class="py-3 px-4">Producto</th>
                                        <th class="py-3 px-4">Cliente / Dueño</th>
                                        <th class="py-3 px-4">Cant.</th>
                                        <th class="py-3 px-4">Foto</th>
                                    </tr>

                                <tbody class="divide-y ${state.darkMode ? 'divide-gray-800' : 'divide-gray-200'}">
                                    ${state.movimientos.map(m => `
                                        <tr>
                                            <td class="py-3 px-4 text-xs text-gray-400">${m.fecha}</td>
                                            <td class="py-3 px-4 font-bold text-xs"><span class="px-2 py-0.5 rounded ${m.tipo === 'ENTRADA' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-amber-500/10 text-amber-500'}">${m.tipo}</span></td>

        let currentBatchItems = [];

            currentBatchItems = [];
            renderBatchModalContent(tipo);
        }

        function renderBatchModalContent(tipo) {
            openModalHTML(`
                <div class="${state.darkMode ? 'bg-gray-950 border-gray-800' : 'bg-white border-gray-200'} border rounded-2xl max-w-xl w-full p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">

                                <datalist id="inventario-datalist-batch">

                            <div>
                                <div class="flex space-x-2">
                                    <input type="number" id="batch-item-cant" min="1" value="1" class="w-full ${state.darkMode ? 'bg-gray-900 border-gray-800 text-white' : 'bg-gray-50 border-gray-300'} border rounded-xl px-3 py-2 text-sm">
                                    <button type="button" onclick="addItemToBatch('${tipo}')" class="bg-amber-600 text-white px-3 py-2 rounded-xl text-xs font-bold">+</button>
                                </div>
                            </div>
                        </div>

                        <div class="border rounded-xl p-3 space-y-2 max-h-45 overflow-y-auto text-xs">
                            ${currentBatchItems.length === 0 ? '<p class="text-gray-400 italic">Lista vacía.</p>' : currentBatchItems.map((b, idx) => `
                                <div class="flex justify-between items-center bg-gray-800/40 p-2 rounded">
                                    <span>${b.item.nombre} (${b.cantidad} un.)</span>
                                    <button onclick="currentBatchItems.splice(${idx},1); renderBatchModalContent('${tipo}');" class="text-red-400"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            `).join('')}
                        </div>

                        ${tipo === 'Salida' ? `
                            <div>
                                <input type="text" id="batch-move-cliente" required placeholder="Nombre del cliente o comprador" class="w-full ${state.darkMode ? 'bg-gray-900 border-gray-800 text-white' : 'bg-gray-50 border-gray-300'} border rounded-xl px-3 py-2 text-sm">
                            </div>
                            <div>
                                <input type="file" id="batch-move-foto" accept="image/*" class="w-full text-xs text-gray-400">
                            </div>
                        ` : ''}

                        <button type="button" onclick="submitBatchMove('${tipo}')" class="w-full bg-amber-600 text-white font-semibold py-3 rounded-xl text-sm shadow">Procesar ${tipo}</button>
                    </div>
                </div>
            `);
        }

        function addItemToBatch(tipo) {
            const searchVal = document.getElementById('batch-item-search').value.trim();
            const cant = Number(document.getElementById('batch-item-cant').value) || 1;
            if (!searchVal) return;

            let item = state.inventario.find(i => i.sku.toLowerCase() === searchVal.toLowerCase() || i.nombre.toLowerCase() === searchVal.toLowerCase());
            if (!item && tipo === 'Entrada') {
                item = { sku: 'JD-' + Math.floor(1000 + Math.random() * 9000), nombre: searchVal, categoria: suggestCategoryByName(searchVal), ubicacion: 'Bodega Principal', cantidad: 0, minimo: 3, precio: 0 };
                state.inventario.push(item);
            }
            if (!item) { showToast("Producto no encontrado", "error"); return; }
            currentBatchItems.push({ item, sku: item.sku, cantidad: cant });
            renderBatchModalContent(tipo);
        }

        function submitBatchMove(tipo) {
            if (currentBatchItems.length === 0) { showToast("Agrega al menos un producto", "error"); return; }
            const cliente = tipo === 'Salida' ? (document.getElementById('batch-move-cliente').value.trim() || 'Cliente General') : 'Entrada Lote';
            const fileInput = document.getElementById('batch-move-foto');

            const finalizar = (fotoUrl) => {
                const now = new Date();
                currentBatchItems.forEach(b => {
                    if (tipo === 'Entrada') b.item.cantidad += b.cantidad;
                    else b.item.cantidad = Math.max(0, b.item.cantidad - b.cantidad);

                    state.movimientos.unshift({
                        id: Date.now() + Math.random(),
                        fecha: now.toLocaleString('es-ES'),
                        tipo: tipo.toUpperCase(),
                        sku: b.sku,
                        producto: b.item.nombre,
                        cliente,
                        cantidad: b.cantidad,
                        responsable: state.currentUserRole === 'admin' ? 'Wendy' : 'Observador',
                        foto: fotoUrl
                    });
                });
                saveState();
                closeModal();
                renderView();
                showToast("Movimiento registrado", "success");
            };

            if (fileInput && fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = e => finalizar(e.target.result);
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                finalizar(null);
            }
        }

        function viewMovementFoto(id) {
            const m = state.movimientos.find(x => String(x.id) === String(id));
            if (!m || !m.foto) return;
            openModalHTML(`
                <div class="${state.darkMode ? 'bg-gray-950 border-gray-800' : 'bg-white border-gray-200'} border rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl text-center">
                    <h3 class="font-bold">Evidencia Fotográfica</h3>
                    <img src="${m.foto}" class="max-h-96 mx-auto rounded-xl">
                    <button onclick="closeModal()" class="w-full bg-gray-800 text-white py-2 rounded-xl text-sm">Cerrar</button>
                </div>
            `);
        }

        function renderPedidos(container) {
            container.innerHTML = `
                <div class="space-y-4">
                    <h2 class="text-xl font-bold">Pedidos y Reabastecimiento</h2>
                    <p class="text-xs text-gray-400">Control de compras pendientes.</p>
                </div>
            `;
        }

        function renderInformes(container) {
            const totalEntradas = state.movimientos.filter(m => m.tipo === 'ENTRADA').reduce((a,b) => a + Number(b.cantidad), 0);
            const totalSalidas = state.movimientos.filter(m => m.tipo === 'SALIDA').reduce((a,b) => a + Number(b.cantidad), 0);
            const balance = totalEntradas - totalSalidas;
            const cardBg = state.darkMode ? 'bg-gray-950 border-gray-800' : 'bg-white border-gray-200 text-gray-800 shadow-sm';

            container.innerHTML = `
                <div class="flex justify-between items-center no-print">
                    <h2 class="text-xl font-bold">Informes y Auditoría</h2>
                    <div class="flex space-x-2">
                        <button onclick="window.print()" class="bg-gray-800 text-white px-3.5 py-2 rounded-xl text-xs font-semibold">Imprimir / PDF</button>
                    </div>
                </div>

                <div id="report-printable-area" class="${cardBg} border rounded-2xl p-6 space-y-6">
                    <div class="border-b pb-4">
                        <h1 class="text-2xl font-bold">Jadever Bodega - Informe</h1>
                        <p class="text-xs text-gray-400 mt-1">Fecha de corte: ${new Date().toLocaleDateString()}</p>
                        <p class="text-xs font-medium mt-2">Entradas: <span class="text-emerald-500 font-bold">${totalEntradas}</span> · Salidas: <span class="text-amber-500 font-bold">${totalSalidas}</span> · Balance: <span class="font-bold">${balance}</span></p>
                    </div>
                    <div>
                        <h3 class="text-xs font-bold uppercase text-gray-400 mb-2">Detalle de Movimientos</h3>
                        <div class="border rounded-xl overflow-hidden text-xs">
                            <table class="w-full text-left">
                                <thead class="bg-gray-100 dark:bg-gray-900">
                                    <tr><th class="p-2">Fecha</th><th class="p-2">Tipo</th><th class="p-2">Producto</th><th class="p-2">Cant</th></tr>
                                </thead>
                                <tbody>
                                    ${state.movimientos.length === 0 ? '<tr><td colspan="4" class="p-4 text-center text-gray-400">Sin movimientos</td></tr>' : state.movimientos.map(m => `
                                        <tr><td class="p-2">${m.fecha}</td><td class="p-2 font-bold">${m.tipo}</td><td class="p-2">${m.producto}</td><td class="p-2 font-bold">${m.cantidad}</td></tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMas(container) {
            container.innerHTML = `
                <div class="space-y-4 max-w-xl">
                    <h2 class="text-xl font-bold">Más Opciones</h2>
                    <div class="bg-white dark:bg-gray-800 border p-5 rounded-2xl space-y-3">
                        <h3 class="font-bold text-red-500">Reiniciar Datos (Poner en 0)</h3>
                        <button onclick="if(confirm('¿Borrar todo?')){state.inventario=[];state.movimientos=[];saveState();renderView();showToast('Sistema en 0','success');}" class="bg-red-600 text-white px-4 py-2 rounded-xl text-xs font-semibold">Limpiar todo a 0</button>
                    </div>
                </div>
            `;
        }

        function renderCargaMasiva(container) {
            container.innerHTML = `
                <div class="space-y-4 max-w-xl">
                    <h2 class="text-xl font-bold">Carga Masiva Excel / CSV</h2>
                    <input type="file" accept=".xlsx, .xls, .csv" onchange="handleExcelUpload(event)" class="w-full text-xs file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-emerald-50 file:text-emerald-700">
                </div>
            `;
        }

        function handleExcelUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
                    for (let i = 1; i < rows.length; i++) {
                        const r = rows[i];
                        if (r && r.length > 0) {
                            state.inventario.push({
                                sku: String(r[0] || 'SKU-' + Math.floor(Math.random()*1000)),
                                nombre: String(r[1] || 'Producto'),
                                categoria: String(r[2] || 'Herramientas Manuales'),
                                ubicacion: String(r[3] || 'Bodega Principal'),
                                cantidad: parseInt(r[4] || 1),
                                minimo: 3,
                                precio: 0
                            });
                        }
                    }
                    saveState();
                    showToast("Inventario importado correctamente", "success");
                    switchTab('inventario');
                } catch(err) {
                    showToast("Error al leer archivo", "error");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        window.onload = function() {
            loadStateLocal();
        };
    </script>
</body>
</html>
