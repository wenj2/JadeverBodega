<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JadeverBodega - Ferretería & Control</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            500: '#ea580c',
                            600: '#d97706',
                            700: '#b45309',
                            900: '#78350f',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Inter & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS for Excel parsing -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- html2pdf for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 3px; }
        @media print {
            aside, header, .no-print, #auth-overlay, #toast-container, #global-modal { display: none !important; }
            body, main { background: white !important; color: black !important; padding: 0 !important; margin: 0 !important; overflow: visible !important; }
            #report-printable-area { border: none !important; box-shadow: none !important; padding: 0 !important; background: white !important; color: black !important; }
        }
    </style>
</head>
<body id="app-body" class="bg-gray-900 text-gray-100 flex h-screen overflow-hidden">

    <!-- Toast Notification container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2"></div>

    <!-- Modal Container -->
    <div id="global-modal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm flex items-center justify-center p-4"></div>

    <!-- PANTALLA DE BLOQUEO Y ACCESO POR CLAVE -->
    <div id="auth-overlay" class="fixed inset-0 z-50 bg-gray-950 flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-3xl p-8 space-y-6 text-center shadow-2xl">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-amber-600 to-amber-500 flex items-center justify-center text-white text-2xl mx-auto shadow-lg shadow-amber-600/30">
                <i class="fa-solid fa-lock"></i>
            </div>
            
            <div>
                <h2 class="text-xl font-bold text-white tracking-tight">JadeverBodega</h2>
                <p class="text-xs text-amber-500 font-semibold tracking-wide uppercase mt-1">Acceso Protegido</p>
                <p class="text-xs text-gray-400 mt-2">Ingresa tu PIN de acceso para continuar</p>
            </div>

            <form onsubmit="handleAuthLogin(event)" class="space-y-4">
                <div class="relative">
                    <input type="password" id="auth-pin-input" maxlength="10" placeholder="••••" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3.5 text-center text-2xl tracking-widest text-white focus:outline-none focus:border-amber-500 transition">
                </div>
                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-semibold py-3 rounded-xl text-sm transition shadow-lg shadow-amber-600/20">
                    Ingresar al Sistema
                </button>
            </form>

            <div class="border-t border-gray-800 pt-4 text-[11px] text-gray-500">
                <span>Modos disponibles: Administrador (Control Total) u Observador (Solo Lectura)</span>
            </div>
        </div>
    </div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="w-64 bg-gray-950 border-r border-gray-800 flex flex-col transition-all duration-300 z-30 shadow-xl shrink-0">
        <!-- Logo Header -->
        <div class="p-4 border-b border-gray-800 flex items-center justify-between">
            <div class="flex items-center space-x-3 overflow-hidden">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-600 to-amber-500 flex items-center justify-center text-white font-bold shadow-lg shadow-amber-600/30 shrink-0">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                </div>
                <div class="sidebar-text">
                    <h1 id="logo-title" class="font-bold text-base tracking-tight text-white leading-tight">JadeverBodega</h1>
                    <span class="text-xs text-amber-500 font-semibold tracking-wide">FERRETERÍA & CONTROL</span>
                </div>
            </div>
            <button onclick="toggleSidebar()" title="Plegar / Expandir Menú" class="text-gray-400 hover:text-white p-1.5 rounded-lg hover:bg-gray-800 transition">
                <i class="fa-solid fa-bars text-sm"></i>
            </button>
        </div>

        <!-- NAVIGATION MENU -->
        <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto custom-scrollbar">
            <button onclick="switchTab('inventario')" id="nav-inventario" class="nav-btn w-full flex items-center justify-between px-3.5 py-3 rounded-xl text-sm font-medium transition-colors bg-amber-600 text-white shadow-md">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-boxes-stacked w-5 text-center"></i>
                    <span class="sidebar-text">Inventario</span>
                </div>
                <span id="badge-inventario" class="sidebar-text px-2 py-0.5 text-xs bg-white/20 rounded-full font-bold">0</span>
            </button>

            <button onclick="switchTab('movimientos')" id="nav-movimientos" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-sm font-medium text-gray-400 hover:bg-gray-800/50 hover:text-white transition-colors">
                <i class="fa-solid fa-right-left w-5 text-center"></i>
                <span class="sidebar-text">Movimientos</span>
            </button>

            <button onclick="switchTab('pedidos')" id="nav-pedidos" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-sm font-medium text-gray-400 hover:bg-gray-800/50 hover:text-white transition-colors">
                <i class="fa-solid fa-cart-shopping w-5 text-center"></i>
                <span class="sidebar-text">Pedidos</span>
            </button>

            <button onclick="switchTab('informes')" id="nav-informes" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-sm font-medium text-gray-400 hover:bg-gray-800/50 hover:text-white transition-colors">
                <i class="fa-solid fa-chart-pie w-5 text-center"></i>
                <span class="sidebar-text">Informes</span>
            </button>

            <button onclick="switchTab('mas')" id="nav-mas" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-sm font-medium text-gray-400 hover:bg-gray-800/50 hover:text-white transition-colors">
                <i class="fa-solid fa-gear w-5 text-center"></i>
                <span class="sidebar-text">Más</span>
            </button>

            <button onclick="switchTab('cargamasiva')" id="nav-cargamasiva" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-sm font-medium text-gray-400 hover:bg-gray-800/50 hover:text-white transition-colors">
                <i class="fa-solid fa-file-excel w-5 text-center text-emerald-400"></i>
                <span class="sidebar-text">Carga masiva</span>
            </button>
        </nav>

        <!-- Dark Mode Toggle & User Profile -->
        <div class="p-4 border-t border-gray-800 space-y-3">
            <div id="theme-card" class="flex items-center justify-between bg-gray-900 border border-gray-800 p-2.5 rounded-xl">
                <div class="flex items-center space-x-2 text-xs font-medium text-gray-300 sidebar-text" id="theme-label-box">
                    <i class="fa-solid fa-moon text-amber-500" id="theme-icon"></i>
                    <span id="theme-text">Modo Oscuro</span>
                </div>
                <button onclick="toggleTheme()" class="p-1 rounded-lg bg-gray-800 hover:bg-gray-700 text-amber-400 transition">
                    <i class="fa-solid fa-circle-half-stroke text-sm"></i>
                </button>
            </div>

            <div class="flex items-center justify-between p-2">
                <div class="flex items-center space-x-3 overflow-hidden">
                    <div id="user-avatar" class="w-9 h-9 rounded-full bg-gradient-to-br from-amber-500 to-amber-700 flex items-center justify-center font-bold text-white text-sm shadow shrink-0">
                        WH
                    </div>
                    <div class="overflow-hidden sidebar-text">
                        <p id="user-name" class="text-sm font-semibold text-white truncate">Wendy Hernandez</p>
                        <p id="user-role" class="text-xs text-amber-500 font-medium flex items-center space-x-1">
                            <i class="fa-solid fa-shield-halved text-[10px]"></i>
                            <span>Administrator</span>
                        </p>
                    </div>
                </div>
                <button onclick="logoutAuth()" title="Cerrar Sesión" class="text-gray-400 hover:text-red-400 text-xs p-1 sidebar-text">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main id="app-main" class="flex-1 flex flex-col h-screen overflow-hidden bg-gray-900">
        
        <!-- TOP APP BAR -->
        <header id="top-header" class="h-16 bg-gray-950 border-b border-gray-800 px-6 flex items-center justify-between z-20">
            <div class="flex items-center space-x-4">
                <button onclick="toggleSidebar()" class="text-gray-400 hover:text-white p-2 rounded-lg bg-gray-900 border border-gray-800 hover:bg-gray-800 transition">
                    <i class="fa-solid fa-bars text-sm"></i>
                </button>
                <div class="text-xs text-gray-400 font-medium hidden md:block">
                    <span id="current-date-header" class="font-semibold uppercase tracking-wider"></span>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <button id="btn-top-excel" onclick="switchTab('cargamasiva')" class="flex items-center space-x-2 bg-gray-800 hover:bg-gray-700 text-gray-200 px-3.5 py-2 rounded-xl text-xs font-semibold border border-gray-700 transition shadow-sm">
                    <i class="fa-solid fa-file-excel text-emerald-400"></i>
                    <span>Cargar Excel</span>
                </button>
                <button id="btn-top-add-product" onclick="openAddProductModal()" class="flex items-center space-x-2 bg-amber-600 hover:bg-amber-500 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-lg shadow-amber-600/30 transition">
                    <i class="fa-solid fa-plus"></i>
                    <span>+ Producto</span>
                </button>
            </div>
        </header>

        <!-- DYNAMIC VIEWS CONTAINER -->
        <div class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar" id="main-content-view">
            <!-- Dynamic Content -->
        </div>

    </main>

    <!-- APPLICATION LOGIC & STATE -->
    <script>
        // --- APP STATE ---
        let state = {
            currentTab: 'inventario',
            darkMode: false, // Default to light mode (white) as requested
            sidebarCollapsed: false,
            currentUserRole: null, // 'admin' | 'observer'
            lastLoginTime: null,
            inventario: [],
            movimientos: [],
            pedidos: [],
            informesGuardados: [],
            evidenciasFacturas: []
        };

        let pendingParsedRows = null;
        let invSearch = '';
        let invCategory = 'Todas';

        const defaultCategories = [
            'Herramientas Manuales',
            'Herramientas Eléctricas',
            'Fijación y Tornillería',
            'Fontanería y Plomería',
            'Pinturas y Acabados',
            'Seguridad e Iluminación',
            'Construcción y Medición'
        ];

        function toggleSidebar() {
            state.sidebarCollapsed = !state.sidebarCollapsed;
            applySidebarState();
        }

        function applySidebarState() {
            const sidebar = document.getElementById('sidebar');
            const texts = document.querySelectorAll('.sidebar-text');
            if (state.sidebarCollapsed) {
                sidebar.classList.remove('w-64');
                sidebar.classList.add('w-20');
                texts.forEach(el => el.classList.add('hidden'));
            } else {
                sidebar.classList.remove('w-20');
                sidebar.classList.add('w-64');
                texts.forEach(el => el.classList.remove('hidden'));
            }
        }

        function suggestCategoryByName(name) {
            const n = name.toLowerCase();
            if (n.includes('taladro') || n.includes('esmeril') || n.includes('sierra') || n.includes('aspiradora') || n.includes('pulidora')) return 'Herramientas Eléctricas';
            if (n.includes('llave') || n.includes('destornillador') || n.includes('alicate') || n.includes('martillo') || n.includes('cizalla')) return 'Herramientas Manuales';
            if (n.includes('tornillo') || n.includes('clavo') || n.includes('remache') || n.includes('tuerca') || n.includes('arandela')) return 'Fijación y Tornillería';
            if (n.includes('tubo') || n.includes('codo') || n.includes('valvula') || n.includes('grifo') || n.includes('llave de chorro') || n.includes('pvc')) return 'Fontanería y Plomería';
            if (n.includes('pintura') || n.includes('brocha') || n.includes('rodillo') || n.includes('silicona') || n.includes('sellador')) return 'Pinturas y Acabados';
            if (n.includes('casco') || n.includes('guante') || n.includes('cable') || n.includes('foco') || n.includes('linterna') || n.includes('bombillo')) return 'Seguridad e Iluminación';
            if (n.includes('automotriz') || n.includes('aceite') || n.includes('filtro') || n.includes('bateria') || n.includes('carro')) return 'Automotriz';
            return 'Construcción y Medición';
        }

        function handleAuthLogin(e) {
            e.preventDefault();
            const pin = document.getElementById('auth-pin-input').value.trim();
            const overlay = document.getElementById('auth-overlay');

            if (pin === '2626') {
                state.currentUserRole = 'admin';
                state.lastLoginTime = Date.now();
                showToast("Acceso como Administrador", "success");
            } else if (pin === '123') {
                state.currentUserRole = 'observer';
                state.lastLoginTime = Date.now();
                showToast("Acceso como Observador (Solo Lectura)", "success");
            } else {
                showToast("PIN incorrecto. Intenta nuevamente.", "error");
                return;
            }

            document.getElementById('auth-pin-input').value = '';
            if (overlay) overlay.classList.add('hidden');
            saveState();
            updateUserUI();
            renderView();
        }

        function checkAuthSessionValidity() {
            const overlay = document.getElementById('auth-overlay');
            const TWELVE_HOURS_MS = 12 * 60 * 60 * 1000;

            if (state.currentUserRole && state.lastLoginTime) {
                const now = Date.now();
                const elapsed = now - state.lastLoginTime;

                if (elapsed < TWELVE_HOURS_MS) {
                    if (overlay) overlay.classList.add('hidden');
                    updateUserUI();
                    return true;
                } else {
                    state.currentUserRole = null;
                    state.lastLoginTime = null;
                    saveState();
                    showToast("Tu sesión de 12 horas ha expirado. Ingresa tu PIN nuevamente.", "error");
                }
            }

            if (overlay) overlay.classList.remove('hidden');
            return false;
        }

        function logoutAuth() {
            state.currentUserRole = null;
            state.lastLoginTime = null;
            saveState();
            const overlay = document.getElementById('auth-overlay');
            if (overlay) overlay.classList.remove('hidden');
        }

        function updateUserUI() {
            const userName = document.getElementById('user-name');
            const userRole = document.getElementById('user-role');
            const userAvatar = document.getElementById('user-avatar');
            const btnTopExcel = document.getElementById('btn-top-excel');
            const btnTopAddProduct = document.getElementById('btn-top-add-product');
            const navCargaMasiva = document.getElementById('nav-cargamasiva');

            if (state.currentUserRole === 'admin') {
                if (userName) userName.innerText = "Wendy Hernandez";
                if (userAvatar) userAvatar.innerText = "WH";
                if (userRole) userRole.innerHTML = `<i class="fa-solid fa-shield-halved text-[10px]"></i><span>Administrador</span>`;
                if (btnTopExcel) btnTopExcel.style.display = 'flex';
                if (btnTopAddProduct) btnTopAddProduct.style.display = 'flex';
                if (navCargaMasiva) navCargaMasiva.style.display = 'flex';
            } else {
                if (userName) userName.innerText = "Usuario Observador";
                if (userAvatar) userAvatar.innerText = "OB";
                if (userRole) userRole.innerHTML = `<i class="fa-solid fa-eye text-[10px]"></i><span>Solo Lectura</span>`;
                if (btnTopExcel) btnTopExcel.style.display = 'none';
                if (btnTopAddProduct) btnTopAddProduct.style.display = 'none';
                if (navCargaMasiva) navCargaMasiva.style.display = 'none';
            }
        }

        function updateDailyDate() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const formatted = now.toLocaleDateString('es-ES', options);
            const headerDate = document.getElementById('current-date-header');
            if (headerDate) headerDate.innerText = formatted;
        }

        function loadState() {
            const saved = localStorage.getItem('jadever_bodega_v4');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed };
                } catch(e) { console.error("Error loading local storage", e); }
            } else {
                state.darkMode = false; // Default explicitly to white on clean start
            }
            updateBadges();
            checkAuthSessionValidity();
            renderView();
        }

        function saveState() {
            localStorage.setItem('jadever_bodega_v4', JSON.stringify({
                inventario: state.inventario,
                movimientos: state.movimientos,
                pedidos: state.pedidos,
                informesGuardados: state.informesGuardados,
                evidenciasFacturas: state.evidenciasFacturas,
                darkMode: state.darkMode,
                currentUserRole: state.currentUserRole,
                lastLoginTime: state.lastLoginTime
            }));
            updateBadges();
        }

        window.addEventListener('beforeunload', function() {
            saveState();
        });

        function updateBadges() {
            const badge = document.getElementById('badge-inventario');
            if (badge) {
                badge.innerText = state.inventario.length;
            }
        }

        function toggleTheme() {
            state.darkMode = !state.darkMode;
            applyTheme();
            saveState();
        }

        function applyTheme() {
            const html = document.documentElement;
            const body = document.getElementById('app-body');
            const main = document.getElementById('app-main');
            const sidebar = document.getElementById('sidebar');
            const topHeader = document.getElementById('top-header');
            const logoTitle = document.getElementById('logo-title');
            const userName = document.getElementById('user-name');
            const themeCard = document.getElementById('theme-card');
            const themeLabelBox = document.getElementById('theme-label-box');
            const themeIcon = document.getElementById('theme-icon');
            const themeText = document.getElementById('theme-text');

            if (state.darkMode) {
                html.classList.add('dark');
                html.classList.remove('light');
                body.className = "bg-gray-900 text-gray-100 flex h-screen overflow-hidden";
                main.className = "flex-1 flex flex-col h-screen overflow-hidden bg-gray-900";
                sidebar.className = "w-64 bg-gray-950 border-r border-gray-800 flex flex-col transition-all duration-300 z-30 shadow-xl";
                topHeader.className = "h-16 bg-gray-950 border-b border-gray-800 px-6 flex items-center justify-between z-20 text-white";
                if (logoTitle) logoTitle.className = "font-bold text-base tracking-tight text-white leading-tight";
                if (userName) userName.className = "text-sm font-semibold text-white truncate";
                if (themeCard) themeCard.className = "flex items-center justify-between bg-gray-900 border border-gray-800 p-2.5 rounded-xl";
                if (themeLabelBox) themeLabelBox.className = "flex items-center space-x-2 text-xs font-medium text-gray-300";
                if (themeIcon) themeIcon.className = "fa-solid fa-moon text-amber-500";
                if (themeText) themeText.innerText = "Modo Oscuro";
            } else {
                html.classList.remove('dark');
                html.classList.add('light');
                body.className = "bg-gray-100 text-gray-800 flex h-screen overflow-hidden";
                main.className = "flex-1 flex flex-col h-screen overflow-hidden bg-gray-100";
                sidebar.className = "w-64 bg-white border-r border-gray-200 flex flex-col transition-all duration-300 z-30 shadow-xl text-gray-800";
                topHeader.className = "h-16 bg-white border-b border-gray-200 px-6 flex items-center justify-between z-20 text-gray-800";
                if (logoTitle) logoTitle.className = "font-bold text-base tracking-tight text-gray-900 leading-tight";
                if (userName) userName.className = "text-sm font-semibold text-gray-900 truncate";
                if (themeCard) themeCard.className = "flex items-center justify-between bg-gray-50 border border-gray-200 p-2.5 rounded-xl";
                if (themeLabelBox) themeLabelBox.className = "flex items-center space-x-2 text-xs font-medium text-gray-700";
                if (themeIcon) themeIcon.className = "fa-solid fa-sun text-amber-500";
                if (themeText) themeText.innerText = "Modo Claro";
            }
            renderView();
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `flex items-center space-x-3 px-4 py-3 rounded-xl shadow-2xl text-sm font-medium text-white transition-all transform translate-y-2 opacity-0 ${
                type === 'success' ? 'bg-emerald-600 border border-emerald-500' : 'bg-red-600 border border-red-500'
            }`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function switchTab(tab) {
            state.currentTab = tab;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.className = `nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-sm font-medium ${state.darkMode ? 'text-gray-400 hover:bg-gray-800/50 hover:text-white' : 'text-gray-600 hover:bg-gray-100 hover:text-gray-900'} transition-colors`;
            });
            const activeBtn = document.getElementById(`nav-${tab}`);
            if (activeBtn) {
                activeBtn.className = "nav-btn w-full flex items-center justify-between px-3.5 py-3 rounded-xl text-sm font-medium transition-colors bg-amber-600 text-white shadow-md";
            }
            renderView();
        }

        function openModalHTML(htmlContent) {
            const container = document.getElementById('global-modal');
            container.innerHTML = htmlContent;
            container.classList.remove('hidden');
        }

        function closeModal() {
            const container = document.getElementById('global-modal');
            container.classList.add('hidden');
            container.innerHTML = '';
        }

        function renderView() {
            const container = document.getElementById('main-content-view');
            if (!container) return;
            container.innerHTML = '';
            switch(state.currentTab) {
                case 'inventario': renderInventario(container); break;
                case 'movimientos': renderMovimientos(container); break;
                case 'pedidos': renderPedidos(container); break;
                case 'informes': renderInformes(container); break;
                case 'mas': renderMas(container); break;
                case 'cargamasiva': renderCargaMasiva(container); break;
            }
            updateBadges();
            updateUserUI();
        }

        // ================= 1. INVENTARIO =================
        function renderInventario(container) {
            const isAdmin = state.currentUserRole === 'admin';
            const totalRef = state.inventario.length;
            const totalUnits = state.inventario.reduce((acc, item) => acc + (Number(item.cantidad) || 0), 0);
            const reorderAlerts = state.inventario.filter(item => Number(item.cantidad) <= Number(item.minimo)).length;
            const totalMovimientos = state.movimientos.length;

            const presentCategories = Array.from(new Set([
                ...defaultCategories,

        function processExcelImport(mode) {
            if (!pendingParsedRows) return;
            
            if (mode === 'replace') {
                state.inventario = [];
            }

            let added = 0, updated = 0;

            pendingParsedRows.forEach((r, idxRow) => {
                const findVal = (keys) => {
                    for (const k of Object.keys(r)) {
                        const cleanKey = k.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                        for (const target of keys) {
                            if (cleanKey.includes(target)) {
                                const val = String(r[k]).trim();
                                if (val && val !== 'undefined' && val !== 'null') return val;
                            }
                        }
                    }
                    return null;
                };

                const values = Object.values(r).map(v => String(v).trim()).filter(Boolean);

                let sku = findVal(['sku', 'cod', 'ref', 'item', 'id', 'clave']);
                if (!sku && values.length > 0) {
                    if (values[0].length <= 20 && !values[0].includes(' ')) sku = values[0];
                }
                if (!sku) sku = 'JD-' + String(1000 + idxRow).padStart(4, '0');

                let nombre = findVal(['producto', 'nombre', 'descripcion', 'art', 'detalle', 'desc']);
                if (!nombre) {
                    const textCandidates = values.filter(v => v !== sku && isNaN(v));
                    if (textCandidates.length > 0) {
                        nombre = textCandidates.reduce((a, b) => a.length >= b.length ? a : b);
                    }
                }
                if (!nombre || nombre.length < 2) nombre = `Producto ${sku}`;

                let categoria = findVal(['categoria', 'cat', 'grupo', 'fam', 'rubro']) || suggestCategoryByName(nombre);
                let ubicacion = findVal(['ubicacion', 'ubi', 'estante', 'bodega', 'pasillo']) || 'Bodega Principal';

                let cantStr = findVal(['cantidad', 'cant', 'stock', 'unid', 'existencia']);
                let cantidad = 0;
                if (cantStr !== null) {
                    cantidad = Number(cantStr.replace(/[^0-9.-]/g, '')) || 0;
                } else {
                    const numVal = values.find(v => !isNaN(v) && v !== sku);
                    if (numVal) cantidad = Number(numVal) || 0;
                }

                let minStr = findVal(['minimo', 'min', 'reorden']);
                let minimo = minStr ? (Number(minStr.replace(/[^0-9.-]/g, '')) || 3) : 3;

                let precioStr = findVal(['precio', 'costo', 'valor', 'pvp', '$']);
                let precio = precioStr ? (Number(precioStr.replace(/[^0-9.-]/g, '')) || 0) : 0;

                const existingIdx = state.inventario.findIndex(i => i.sku.toLowerCase() === sku.toLowerCase());
                if (existingIdx !== -1) {
                    if (mode === 'replace') {
                        state.inventario[existingIdx] = { sku, nombre, categoria, ubicacion, cantidad, minimo, precio };
                    } else {
                        state.inventario[existingIdx].cantidad += cantidad;
                        if (nombre) state.inventario[existingIdx].nombre = nombre;
                        if (categoria) state.inventario[existingIdx].categoria = categoria;
                        if (precio > 0) state.inventario[existingIdx].precio = precio;
                    }
                    updated++;
                } else {
                    state.inventario.push({ sku, nombre, categoria, ubicacion, cantidad, minimo, precio });
                    added++;
                }
            });

            state.inventario.sort((a,b) => a.sku.localeCompare(b.sku));
            pendingParsedRows = null;
            saveState();
            closeModal();
            switchTab('inventario');
            showToast(mode === 'replace' ? `Inventario cargado (${added} productos procesados)` : `Excel fusionado: ${added} nuevos, ${updated} actualizados`, "success");
        }

        function handleQuickMove(e, sku, tipo) {
            e.preventDefault();
            const item = state.inventario.find(i => i.sku === sku);
            if (!item) return;

            const cant = Number(document.getElementById('move-cant').value) || 0;
            let cliente = 'Entrada Stock';

            if (tipo === 'Salida') {
                if (cant > item.cantidad) {
                    showToast("No hay suficiente stock para realizar esta salida", "error");
                    return;
                }
                cliente = document.getElementById('move-cliente').value.trim() || 'Cliente General';
                const fileInput = document.getElementById('move-foto');
                if (fileInput && fileInput.files && fileInput.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        saveMovementBatch([{ item, sku, cantidad: cant }], tipo, cliente, evt.target.result);
                    };
                    reader.readAsDataURL(fileInput.files[0]);
                    return;
                }
            }

            saveMovementBatch([{ item, sku, cantidad: cant }], tipo, cliente, null);
        }

        function saveMovementBatch(batchItems, tipo, cliente, foto) {
            const now = new Date();
            const fechaStr = now.toLocaleString('es-ES');
            const timestamp = now.getTime();
            const responsable = state.currentUserRole === 'admin' ? 'Wendy Hernandez' : 'Usuario Observador';

            batchItems.forEach(b => {
                if (tipo.toUpperCase() === 'ENTRADA') {
                    b.item.cantidad += b.cantidad;
                } else {
                    b.item.cantidad -= b.cantidad;
                }

                state.movimientos.unshift({
                    id: Date.now() + Math.random(),
                    fecha: fechaStr,
                    timestamp: timestamp,
                    tipo: tipo.toUpperCase(),
                    sku: b.sku,
                    producto: b.item.nombre,
                    cliente: cliente,
                    cantidad: b.cantidad,
                    responsable: responsable,
                    foto: foto
                });
            });

            saveState();
            closeModal();
            renderView();
            showToast(`${tipo} masiva registrada con éxito`, "success");
        }

        function addItemToBatch(tipo) {
            const searchVal = document.getElementById('batch-item-search').value.trim();
            const cant = Number(document.getElementById('batch-item-cant').value) || 1;

            if (!searchVal) {
                showToast("Escribe o selecciona un producto", "error");
                return;
            }

            let item = state.inventario.find(i => i.sku.toLowerCase() === searchVal.toLowerCase() || i.nombre.toLowerCase() === searchVal.toLowerCase());

            if (!item && tipo === 'Entrada') {
                item = {
                    sku: 'JD-' + Math.floor(1000 + Math.random() * 9000),
                    nombre: searchVal,
                    categoria: suggestCategoryByName(searchVal),
                    ubicacion: 'Bodega Principal',
                    cantidad: 0,
                    minimo: 3,
                    precio: 0
                };
                state.inventario.push(item);
                state.inventario.sort((a,b) => a.sku.localeCompare(b.sku));
            }

            if (!item) {
                showToast("El producto no existe en el inventario", "error");
                return;
            }

            if (tipo === 'Salida' && cant > item.cantidad) {
                showToast(`Stock insuficiente para ${item.nombre} (Disponibles: ${item.cantidad})`, "error");
                return;
            }

            currentBatchItems.push({ item, sku: item.sku, cantidad: cant });
            document.getElementById('batch-item-search').value = '';
            document.getElementById('batch-item-cant').value = '1';
            renderBatchModalContent(tipo);
        }

        function removeBatchItem(idx, tipo) {
            currentBatchItems.splice(idx, 1);
            renderBatchModalContent(tipo);
        }

        function submitBatchMove(tipo) {
            if (currentBatchItems.length === 0) {
                showToast("Agrega al menos un producto a la lista", "error");

                    reader.onload = function(evt) {
                        saveMovementBatch(currentBatchItems, tipo, cliente, evt.target.result);

                    reader.readAsDataURL(fileInput.files[0]);
                    return;

            saveMovementBatch(currentBatchItems, tipo, cliente, null);

        // ================= 4. INFORMES =================

            const totalEntradas = state.movimientos.filter(m => m.tipo === 'ENTRADA').reduce((a,b) => a + Number(b.cantidad), 0);
            const totalSalidas = state.movimientos.filter(m => m.tipo === 'SALIDA').reduce((a,b) => a + Number(b.cantidad), 0);
            const balance = totalEntradas - totalSalidas;

            container.innerHTML = `
                <div class="flex flex-wrap items-center justify-between gap-3 no-print">
                    <div>
                        <h2 class="text-xl font-bold ${state.darkMode ? 'text-white' : 'text-gray-900'}">Analítica & Auditoría</h2>
                        <p class="text-xs text-gray-400">Resumen operativo y reporte listo para exportación</p>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="saveCurrentReport()" class="bg-amber-600 hover:bg-amber-500 text-white px-3.5 py-2 rounded-xl text-xs font-semibold transition shadow-md">
                            + Guardar Informe
                        </button>
                        <button onclick="downloadPDF()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-3.5 py-2 rounded-xl text-xs font-semibold border border-gray-700 transition">
                            <i class="fa-solid fa-file-pdf text-red-400 mr-1"></i> Descargar PDF
                        </button>
                        <button onclick="triggerPrintReport()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-3.5 py-2 rounded-xl text-xs font-semibold border border-gray-700 transition">
                            <i class="fa-solid fa-print text-blue-400 mr-1"></i> Imprimir
                        </button>
                        ${isAdmin ? `
                            <button onclick="openAddFacturaModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-2 rounded-xl text-xs font-semibold transition shadow-md">
                                <i class="fa-solid fa-camera mr-1"></i> Subir Foto Evidencia
                            </button>
                        ` : ''}
                    </div>
                </div>

                <div id="report-printable-area" class="${state.darkMode ? 'bg-gray-950 border-gray-800 text-white' : 'bg-white border-gray-200 text-gray-900'} border rounded-2xl p-8 space-y-6 shadow-sm">
                    <div class="border-b ${state.darkMode ? 'border-gray-800' : 'border-gray-200'} pb-4">
                        <h1 class="text-2xl font-bold ${state.darkMode ? 'text-white' : 'text-gray-900'}">Jadever Bodega — Informe</h1>
                        <p class="text-sm font-semibold text-amber-600 mt-1">Reporte de hoy (${todayStr} a ${todayStr})</p>
                        <p class="text-xs font-medium ${state.darkMode ? 'text-gray-300' : 'text-gray-600'} mt-2">
                            Entradas: <span class="font-bold text-emerald-500">${totalEntradas} und</span> · 
                            Salidas: <span class="font-bold text-amber-500">${totalSalidas} und</span> · 
                            Balance: <span class="font-bold ${state.darkMode ? 'text-white' : 'text-gray-900'}">${balance}</span> · 
                            Movimientos: <span class="font-bold text-blue-500">${state.movimientos.length}</span>
                        </p>
                    </div>

                    <div>
                        <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-3">DETALLE DE MOVIMIENTOS DEL PERIODO</h3>
                        <div class="overflow-x-auto rounded-xl border ${state.darkMode ? 'border-gray-800 bg-gray-900/50' : 'border-gray-200 bg-gray-50'}">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="bg-amber-600 text-white font-bold uppercase tracking-wider">
                                        <th class="py-3 px-4">FECHA</th>
                                        <th class="py-3 px-4">TIPO</th>
                                        <th class="py-3 px-4">SKU</th>
                                        <th class="py-3 px-4">PRODUCTO</th>
                                        <th class="py-3 px-4">CANT.</th>
                                        <th class="py-3 px-4">RESPONSABLE</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y ${state.darkMode ? 'divide-gray-800 text-gray-200' : 'divide-gray-200 text-gray-800'}">
                                    ${state.movimientos.length === 0 ? `
                                        <tr>
                                            <td colspan="6" class="py-6 text-center text-gray-500">Sin movimientos registrados en el periodo seleccionado.</td>
                                        </tr>
                                    ` : state.movimientos.map(m => `
                                        <tr class="${state.darkMode ? 'hover:bg-gray-900/40' : 'hover:bg-gray-100'}">
                                            <td class="py-3 px-4 text-gray-400">${m.fecha}</td>
                                            <td class="py-3 px-4 font-bold ${m.tipo === 'ENTRADA' ? 'text-emerald-500' : 'text-amber-500'}">${m.tipo}</td>
                                            <td class="py-3 px-4 font-mono font-bold text-amber-500">${m.sku}</td>
                                            <td class="py-3 px-4 font-semibold ${state.darkMode ? 'text-white' : 'text-gray-900'}">${m.producto}</td>
                                            <td class="py-3 px-4 font-bold ${state.darkMode ? 'text-white' : 'text-gray-900'}">${m.cantidad}</td>
                                            <td class="py-3 px-4 text-gray-400">${m.responsable}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="${cardBg} border rounded-2xl p-6 space-y-4 no-print">
                    <div class="flex items-center justify-between border-b ${state.darkMode ? 'border-gray-800' : 'border-gray-200'} pb-3">
                        <h3 class="font-bold ${state.darkMode ? 'text-white' : 'text-gray-900'} text-base">Evidencias de Facturas & Fotos (Ordenadas por Fecha)</h3>
                        <span class="text-xs text-amber-500 font-semibold">${state.evidenciasFacturas.length} Evidencias</span>
                    </div>

                    ${state.evidenciasFacturas.length === 0 ? `
                        <p class="text-xs text-gray-400 text-center py-8">Aún no has subido fotos de evidencias. Presiona "Subir Foto Evidencia" para agregar una.</p>
                    ` : `
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                            ${state.evidenciasFacturas.sort((a,b) => b.timestamp - a.timestamp).map(ev => `
                                <div class="rounded-xl border ${state.darkMode ? 'bg-gray-900 border-gray-800' : 'bg-gray-50 border-gray-200'} p-3 space-y-2">
                                    <img src="${ev.foto}" alt="Evidencia" class="w-full h-40 object-cover rounded-lg border border-gray-800">
                                    <div class="flex items-center justify-between text-xs">
                                        <span class="font-semibold ${state.darkMode ? 'text-white' : 'text-gray-900'}">${ev.titulo || 'Evidencia Factura'}</span>
                                        <span class="text-gray-400 text-[10px]">${ev.fecha}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        function saveCurrentReport() {
            const todayStr = new Date().toISOString().split('T')[0];
            state.informesGuardados.push({
                id: Date.now(),
                fecha: todayStr,
                movimientos: state.movimientos.length
            });
            saveState();
            showToast("Informe guardado en el historial", "success");
        }

        function downloadPDF() {
            const element = document.getElementById('report-printable-area');
            const todayStr = new Date().toISOString().split('T')[0];
            const opt = {
                margin:       0.4,
                filename:     `informe-${todayStr}_${todayStr}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, backgroundColor: "#ffffff" },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };
            
            // Temporarily force white background for PDF generation
            const originalClassName = element.className;
            element.className = "bg-white text-gray-900 border border-gray-200 rounded-2xl p-8 space-y-6 shadow-sm";
            
            html2pdf().set(opt).from(element).save().then(() => {
                element.className = originalClassName;
            });
        }

        function triggerPrintReport() {
            window.print();
        }

        function openAddFacturaModal() {
            openModalHTML(`
                <div class="${state.darkMode ? 'bg-gray-950 border-gray-800' : 'bg-white border-gray-200'} border rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                    <div class="flex items-center justify-between border-b ${state.darkMode ? 'border-gray-800' : 'border-gray-200'} pb-3">
                        <h3 class="font-bold ${state.darkMode ? 'text-white' : 'text-gray-900'} text-base">Subir Foto de Evidencia / Factura</h3>
                        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-gray-800 text-gray-400 hover:text-white flex items-center justify-center">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                    <form onsubmit="handleSaveFactura(event)" class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Título / Factura N°</label>
                            <input type="text" id="fac-titulo" required placeholder="Ej: Factura 4509 - Compra Martillos" class="w-full ${state.darkMode ? 'bg-gray-900 border-gray-800 text-white' : 'bg-gray-50 border-gray-300 text-gray-900'} border rounded-xl px-3.5 py-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Imagen (Foto)</label>
                            <input type="file" id="fac-foto" accept="image/*" required class="w-full text-xs text-gray-400">
                        </div>
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl text-sm transition shadow-lg">
                            Guardar Evidencia
                        </button>
                    </form>
                </div>
            `);
        }

        function handleSaveFactura(e) {
            e.preventDefault();
            const titulo = document.getElementById('fac-titulo').value.trim();
            const fileInput = document.getElementById('fac-foto');

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const now = new Date();
                    state.evidenciasFacturas.push({
                        id: Date.now(),
                        titulo: titulo,
                        foto: evt.target.result,
                        fecha: now.toLocaleString('es-ES'),
                        timestamp: now.getTime()
                    });
                    saveState();
                    closeModal();
                    renderView();
                    showToast("Evidencia cargada con éxito", "success");
                };
                reader.readAsDataURL(fileInput.files[0]);
            }
        }

        // ================= 5. MÁS =================
        function renderMas(container) {
            const isAdmin = state.currentUserRole === 'admin';
            const cardBg = state.darkMode ? 'bg-gray-950 border-gray-800' : 'bg-white border-gray-200 text-gray-800 shadow-sm';

            container.innerHTML = `
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-xl font-bold ${state.darkMode ? 'text-white' : 'text-gray-900'}">Copia de Seguridad</h2>
                        <p class="text-xs text-gray-400">Gestión de respaldo y datos del sistema</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="${cardBg} border rounded-2xl p-5 space-y-4">
                        <h3 class="font-bold ${state.darkMode ? 'text-white' : 'text-gray-900'} text-sm">Respaldo Automático</h3>
                        <p class="text-xs text-gray-400">Toda la información se guarda automáticamente cada 12 horas y al salir de la aplicación.</p>
                    </div>

                    ${isAdmin ? `
                        <div class="${cardBg} border rounded-2xl p-5 space-y-4">
                            <h3 class="font-bold text-red-500 text-sm">Reiniciar Datos (Poner en 0)</h3>
                            <p class="text-xs text-gray-400">Restablecer la aplicación a 0 todo el sistema.</p>
                            <button onclick="resetAllData()" class="w-full bg-red-600 hover:bg-red-500 text-white font-semibold py-2.5 rounded-xl text-xs transition shadow-md">
                                Limpiar todo a 0
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function resetAllData() {
            if (confirm("¿ADVERTENCIA: Deseas borrar todo el inventario, movimientos e informes? Esta acción dejará la app en 0.")) {
                state.inventario = [];
                state.movimientos = [];
                state.pedidos = [];
                state.informesGuardados = [];
                state.evidenciasFacturas = [];
                saveState();
                renderView();
                showToast("Sistema restablecido completamente a 0", "success");
            }
        }

        // ================= 6. CARGA MASIVA =================
        function renderCargaMasiva(container) {
            const cardBg = state.darkMode ? 'bg-gray-950 border-gray-800' : 'bg-white border-gray-200 text-gray-800 shadow-sm';

            container.innerHTML = `
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-xl font-bold ${state.darkMode ? 'text-white' : 'text-gray-900'}">Carga Masiva de Productos</h2>
                        <p class="text-xs text-gray-400">Importación rápida mediante archivos Excel (.xlsx) o CSV</p>
                    </div>
                </div>

                <div class="${cardBg} border rounded-2xl p-8 text-center space-y-4">
                    <div class="w-16 h-16 rounded-2xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-2xl mx-auto">
                        <i class="fa-solid fa-file-excel"></i>
                    </div>
                    <div>
                        <h3 class="font-bold ${state.darkMode ? 'text-white' : 'text-gray-900'} text-base">Arrastra o Selecciona tu archivo Excel / CSV</h3>
                        <p class="text-xs text-gray-400 mt-1">Soporta columnas: SKU, Producto, Categoría, Ubicación, Cantidad y Precio</p>
                    </div>

                    <input type="file" id="excel-file-input" accept=".xlsx,.xls,.csv" onchange="handleExcelFileUpload(event)" class="hidden">

                    <button onclick="document.getElementById('excel-file-input').click()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-6 py-3 rounded-xl text-sm transition shadow-lg inline-flex items-center space-x-2">
                        <i class="fa-solid fa-upload"></i>
                        <span>Seleccionar Archivo desde el Equipo</span>
                    </button>
                </div>
            `;
        }

        function handleExcelFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    pendingParsedRows = XLSX.utils.sheet_to_json(worksheet, { defval: '' });

                    if (!pendingParsedRows || pendingParsedRows.length === 0) {
                        showToast("El archivo Excel está vacío o es inválido", "error");
                        return;
                    }

                    openModalHTML(`
                        <div class="${state.darkMode ? 'bg-gray-950 border-gray-800' : 'bg-white border-gray-200'} border rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl text-center">
                            <h3 class="font-bold ${state.darkMode ? 'text-white' : 'text-gray-900'} text-lg">Opciones de Importación</h3>
                            <p class="text-xs text-gray-400">Se leyeron ${pendingParsedRows.length} productos del archivo.</p>
                            <div class="space-y-2 pt-2">
                                <button onclick="processExcelImport('update')" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-semibold py-3 rounded-xl text-sm transition shadow">
                                    Actualizar / Fusionar (Merge & Add)
                                </button>
                                <button onclick="processExcelImport('replace')" class="w-full bg-red-600 hover:bg-red-500 text-white font-semibold py-3 rounded-xl text-sm transition shadow">
                                    Subir y Reemplazar Todo (Overwrite)
                                </button>
                            </div>
                        </div>
                    `);
                } catch(err) {
                    showToast("Error al leer el archivo Excel", "error");
                    console.error(err);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        window.onload = function() {
            updateDailyDate();
            loadState();
            applyTheme();
        };
    </script>
</body>
</html>
