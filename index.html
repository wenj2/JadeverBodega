<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JadeverBodega - Ferretería & Control</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            500: '#ea580c',
                            600: '#d97706',
                            700: '#b45309',
                            900: '#78350f',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Inter & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS for Excel parsing -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.firebaseModules = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken,
            getFirestore, doc, setDoc, getDoc, onSnapshot, collection
        };
        window.dispatchEvent(new Event('firebase-loaded'));
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 3px; }
        @media print {
            aside, header, .no-print, #auth-overlay, #toast-container, #global-modal { display: none !important; }
            body, main { background: white !important; color: black !important; padding: 0 !important; margin: 0 !important; overflow: visible !important; }
            #report-printable-area { border: none !important; box-shadow: none !important; padding: 0 !important; background: white !important; color: black !important; }
        }
    </style>
</head>
<body id="app-body" class="bg-gray-100 text-gray-800 flex h-screen overflow-hidden">

    <!-- Toast Notification container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2"></div>

    <!-- Modal Container -->
    <div id="global-modal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm flex items-center justify-center p-4"></div>

    <!-- PANTALLA DE BLOQUEO Y ACCESO POR CLAVE (12 horas) -->
    <div id="auth-overlay" class="fixed inset-0 z-50 bg-gray-950 flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-3xl p-8 space-y-6 text-center shadow-2xl">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-amber-600 to-amber-500 flex items-center justify-center text-white text-2xl mx-auto shadow-lg shadow-amber-600/30">
                <i class="fa-solid fa-lock"></i>
            </div>
            <div>
                <h2 class="text-xl font-bold text-white tracking-tight">JadeverBodega</h2>
                <p class="text-xs text-amber-500 font-semibold tracking-wide uppercase mt-1">Acceso Protegido</p>
                <p class="text-xs text-gray-400 mt-2">Ingresa tu PIN de acceso (válido por 12 horas)</p>
            </div>
            <form onsubmit="handleAuthLogin(event)" class="space-y-4">
                <div class="relative">
                    <input type="password" id="auth-pin-input" maxlength="10" placeholder="••••" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3.5 text-center text-2xl tracking-widest text-white focus:outline-none focus:border-amber-500 transition">
                </div>
                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-semibold py-3 rounded-xl text-sm transition shadow-lg shadow-amber-600/20">
                    Ingresar al Sistema
                </button>
            </form>
            <div class="border-t border-gray-800 pt-4 text-[11px] text-gray-500">
                <span>PIN Admin: 2626 | PIN Observador: 123</span>
            </div>
        </div>
    </div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="w-64 bg-white border-r border-gray-200 flex flex-col transition-all duration-300 z-30 shadow-xl shrink-0 text-gray-800">
        <!-- Logo Header -->
        <div class="p-4 border-b border-gray-200 dark:border-gray-800 flex items-center justify-between">
            <div class="flex items-center space-x-3 overflow-hidden">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-600 to-amber-500 flex items-center justify-center text-white font-bold shadow-lg shadow-amber-600/30 shrink-0">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                </div>
                <div class="sidebar-text">
                    <h1 id="logo-title" class="font-bold text-base tracking-tight text-gray-900 leading-tight">JadeverBodega</h1>
                    <span class="text-xs text-amber-500 font-semibold tracking-wide">FERRETERÍA & CONTROL</span>
                </div>
            </div>
            <button onclick="toggleSidebar()" title="Plegar / Expandir Menú" class="text-gray-400 hover:text-gray-700 dark:hover:text-white p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition">
                <i class="fa-solid fa-bars text-sm"></i>
            </button>
        </div>

        <!-- NAVIGATION MENU -->
        <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto custom-scrollbar">
            <button onclick="switchTab('inventario')" id="nav-inventario" class="nav-btn w-full flex items-center justify-between px-3.5 py-3 rounded-xl text-sm font-medium transition-colors bg-amber-600 text-white shadow-md">

            <button onclick="switchTab('movimientos')" id="nav-movimientos" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800/50 transition-colors">
                <i class="fa-solid fa-right-left w-5 text-center"></i>
                <span class="sidebar-text">Movimientos</span>
            </button>

            <button onclick="switchTab('pedidos')" id="nav-pedidos" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800/50 transition-colors">

                <span class="sidebar-text">Pedidos</span>

            <button onclick="switchTab('informes')" id="nav-informes" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800/50 transition-colors">
                <i class="fa-solid fa-chart-pie w-5 text-center"></i>
                <span class="sidebar-text">Informes</span>
            </button>

            <button onclick="switchTab('mas')" id="nav-mas" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800/50 transition-colors">
                <i class="fa-solid fa-gear w-5 text-center"></i>
                <span class="sidebar-text">Más</span>
            </button>
        </nav>

        <!-- Dark Mode Toggle & User Profile -->
        <div class="p-4 border-t border-gray-200 dark:border-gray-800 space-y-3">
            <div id="theme-card" class="flex items-center justify-between bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 p-2.5 rounded-xl">
                <div class="flex items-center space-x-2 text-xs font-medium text-gray-700 dark:text-gray-300 sidebar-text" id="theme-label-box">
                    <i class="fa-solid fa-sun text-amber-500" id="theme-icon"></i>
                    <span id="theme-text">Modo Claro</span>
                </div>
                <button onclick="toggleTheme()" class="p-1.5 rounded-lg bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 text-amber-500 transition">
                    <i class="fa-solid fa-circle-half-stroke text-sm"></i>
                </button>
            </div>

            <div class="flex items-center justify-between p-2">
                <div class="flex items-center space-x-3 overflow-hidden">
                    <div id="user-avatar" class="w-9 h-9 rounded-full bg-gradient-to-br from-amber-500 to-amber-700 flex items-center justify-center font-bold text-white text-sm shadow shrink-0">
                        WH
                    </div>
                    <div class="overflow-hidden sidebar-text">
                        <p id="user-name" class="text-sm font-semibold text-gray-900 dark:text-white truncate">Wendy Hernandez</p>
                        <p id="user-role" class="text-xs text-amber-500 font-medium flex items-center space-x-1">
                            <i class="fa-solid fa-shield-halved text-[10px]"></i>
                            <span>Administrador</span>
                        </p>
                    </div>
                </div>
                <button onclick="logoutAuth()" title="Cerrar Sesión" class="text-gray-400 hover:text-red-500 text-xs p-1 sidebar-text">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main id="app-main" class="flex-1 flex flex-col h-screen overflow-hidden bg-gray-100">
        
        <!-- TOP APP BAR -->
        <header id="top-header" class="h-16 bg-white dark:bg-gray-950 border-b border-gray-200 dark:border-gray-800 px-6 flex items-center justify-between z-20 text-gray-800">
            <div class="flex items-center space-x-4">
                <button onclick="toggleSidebar()" class="text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white p-2 rounded-lg bg-gray-100 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 transition">
                    <i class="fa-solid fa-bars text-sm"></i>
                </button>
                <div class="text-xs text-gray-500 dark:text-gray-400 font-medium hidden md:block">
                    <span id="current-date-header" class="font-semibold uppercase tracking-wider"></span>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <button onclick="openMovimientoModal('ENTRADA')" class="flex items-center space-x-2 bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-2 rounded-xl text-xs font-semibold shadow-md transition">
                    <i class="fa-solid fa-arrow-down"></i>
                    <span>+ Entrada</span>
                </button>
                <button onclick="openMovimientoModal('SALIDA')" class="flex items-center space-x-2 bg-rose-600 hover:bg-rose-500 text-white px-3.5 py-2 rounded-xl text-xs font-semibold shadow-md transition">
                    <i class="fa-solid fa-arrow-up"></i>
                    <span>- Salida</span>
                </button>
                <button onclick="openAddProductModal()" class="flex items-center space-x-2 bg-amber-600 hover:bg-amber-500 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-lg shadow-amber-600/30 transition">
                    <i class="fa-solid fa-plus"></i>
                    <span>+ Producto</span>
                </button>
            </div>
        </header>

        <!-- DYNAMIC VIEWS CONTAINER -->
        <div class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar" id="main-content-view">
            <!-- Dynamic Content -->
        </div>

    </main>

    <!-- APPLICATION LOGIC & STATE -->
    <script>
        let state = {
            currentTab: 'inventario',
            darkMode: false, // Default Light mode
            sidebarCollapsed: false,
            currentUserRole: null,
            lastLoginTime: null,
            inventario: [
                { sku: "JDHM1305", nombre: "MARTILLO MAQUINISTA", categoria: "Herramientas Manuales", ubicacion: "Pasillo 1 - Estante 2", cantidad: 15, precio: 12.50 },
                { sku: "JDCDS520", nombre: "TALADRO INALÁMBRICO 12V", categoria: "Herramientas Eléctricas", ubicacion: "Pasillo 2 - Estante 1", cantidad: 8, precio: 85.00 },
                { sku: "DT4376", nombre: "SPRAY BLANCO MATE", categoria: "Pinturas y Acabados", ubicacion: "Pasillo 4 - Estante 3", cantidad: 25, precio: 6.00 }
            ],
            movimientos: [],
            pedidos: [],
            informesGuardados: [],
            evidenciasFacturas: []
        };

        let db = null;
        let auth = null;
        let unsubscribeFirestore = null;
        let isSyncingFromCloud = false;

        let invSearch = '';
        let invCategory = 'Todas';

        // Lote temporal para Entradas y Salidas múltiples
        let loteMovimientoItems = [];

        window.addEventListener('firebase-loaded', async () => {
            try {
                const appId = 'jadeverbodega-app-v2';
                const firebaseConfig = {
                    apiKey: "AIzaSyB4hiDPrrUhiu8HHoH_gdbFVX5nU0vOgM",
                    authDomain: "jadeverbodega.firebaseapp.com",
                    projectId: "jadeverbodega",
                    storageBucket: "jadeverbodega.appspot.com",
                    messagingSenderId: "801005563673",
                    appId: "1:801005563673:web:01ad1465257cf9e9b3df88"
                };

                const app = window.firebaseModules.initializeApp(firebaseConfig);
                db = window.firebaseModules.getFirestore(app);
                auth = window.firebaseModules.getAuth(app);
                await window.firebaseModules.signInAnonymously(auth);

                initRealtimeSync(appId);
            } catch(e) {
                console.warn("Cloud Firestore offline mode:", e);
                loadStateLocal();
            }
        });

        function initRealtimeSync(appId) {
            if (!db || !auth) return;
            const docRef = window.firebaseModules.doc(db, 'artifacts', appId, 'public', 'data', 'appState');
            if (unsubscribeFirestore) unsubscribeFirestore();
            unsubscribeFirestore = window.firebaseModules.onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const cloudData = docSnap.data();
                    if (cloudData && cloudData.payload) {
                        isSyncingFromCloud = true;
                        try {
                            const parsed = JSON.parse(cloudData.payload);
                            state = { ...state, ...parsed };
                            updateBadges();
                            checkAuthSessionValidity();
                            renderView();
                        } catch(err) { console.error("Error parsing cloud state", err); }
                        isSyncingFromCloud = false;
                    }
                } else {
                    saveState();
                }
            }, (error) => { loadStateLocal(); });
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadStateLocal();
            updateDailyDate();
        });

        function updateDailyDate() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const formatted = now.toLocaleDateString('es-ES', options);
            const headerDate = document.getElementById('current-date-header');
            if (headerDate) headerDate.innerText = formatted;
        }

        function loadStateLocal() {
            const saved = localStorage.getItem('jadever_bodega_v5');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed };
                } catch(e) {}
            }
            applyTheme();
            updateBadges();
            checkAuthSessionValidity();
            renderView();
        }

        function saveState() {
            const payloadString = JSON.stringify({
                inventario: state.inventario,
                movimientos: state.movimientos,
                pedidos: state.pedidos,
                darkMode: state.darkMode,
                currentUserRole: state.currentUserRole,
                lastLoginTime: state.lastLoginTime
            });
            localStorage.setItem('jadever_bodega_v5', payloadString);
            updateBadges();

            if (db && auth && !isSyncingFromCloud) {
                const appId = 'jadeverbodega-app-v2';
                const docRef = window.firebaseModules.doc(db, 'artifacts', appId, 'public', 'data', 'appState');
                window.firebaseModules.setDoc(docRef, { payload: payloadString, updatedAt: Date.now() }, { merge: true }).catch(err => {});
            }
        }

        window.addEventListener('beforeunload', () => { saveState(); });

        function updateBadges() {
            const badge = document.getElementById('badge-inventario');
            if (badge) badge.innerText = state.inventario.length;
        }

        function toggleTheme() {
            state.darkMode = !state.darkMode;
            applyTheme();
            saveState();
        }

        function applyTheme() {
            const html = document.documentElement;
            const body = document.getElementById('app-body');
            const main = document.getElementById('app-main');
            const sidebar = document.getElementById('sidebar');
            const topHeader = document.getElementById('top-header');

            if (state.darkMode) {
                html.classList.add('dark');
                html.classList.remove('light');
                body.className = "bg-gray-900 text-gray-100 flex h-screen overflow-hidden";
                main.className = "flex-1 flex flex-col h-screen overflow-hidden bg-gray-900";
                sidebar.className = "w-64 bg-gray-950 border-r border-gray-800 flex flex-col transition-all duration-300 z-30 shadow-xl text-gray-100";
                topHeader.className = "h-16 bg-gray-950 border-b border-gray-800 px-6 flex items-center justify-between z-20 text-white";
                document.getElementById('theme-icon').className = "fa-solid fa-moon text-amber-500";
                document.getElementById('theme-text').innerText = "Modo Oscuro";
            } else {
                html.classList.remove('dark');
                html.classList.add('light');
                body.className = "bg-gray-100 text-gray-800 flex h-screen overflow-hidden";
                main.className = "flex-1 flex flex-col h-screen overflow-hidden bg-gray-100";
                sidebar.className = "w-64 bg-white border-r border-gray-200 flex flex-col transition-all duration-300 z-30 shadow-xl text-gray-800";
                topHeader.className = "h-16 bg-white border-b border-gray-200 px-6 flex items-center justify-between z-20 text-gray-800";
                document.getElementById('theme-icon').className = "fa-solid fa-sun text-amber-500";
                document.getElementById('theme-text').innerText = "Modo Claro";
            }
        }

        function toggleSidebar() {
            state.sidebarCollapsed = !state.sidebarCollapsed;
            const sidebar = document.getElementById('sidebar');
            const texts = document.querySelectorAll('.sidebar-text');
            if (state.sidebarCollapsed) {
                sidebar.classList.remove('w-64'); sidebar.classList.add('w-20');
                texts.forEach(el => el.classList.add('hidden'));
            } else {
                sidebar.classList.remove('w-20'); sidebar.classList.add('w-64');
                texts.forEach(el => el.classList.remove('hidden'));
            }
        }

        function handleAuthLogin(e) {
            e.preventDefault();
            const pin = document.getElementById('auth-pin-input').value.trim();
            if (pin === '2626') {
                state.currentUserRole = 'admin';
                state.lastLoginTime = Date.now();
                showToast("Acceso Administrador concedido", "success");
            } else if (pin === '123') {
                state.currentUserRole = 'observer';
                state.lastLoginTime = Date.now();
                showToast("Acceso Observador (Lectura)", "success");
            } else {
                showToast("PIN incorrecto", "error");
                return;
            }
            document.getElementById('auth-pin-input').value = '';
            document.getElementById('auth-overlay').classList.add('hidden');
            saveState();
            updateUserUI();
            renderView();
        }

        function checkAuthSessionValidity() {
            const overlay = document.getElementById('auth-overlay');
            const TWELVE_HOURS = 12 * 60 * 60 * 1000;
            if (state.currentUserRole && state.lastLoginTime) {
                if (Date.now() - state.lastLoginTime < TWELVE_HOURS) {
                    overlay.classList.add('hidden');
                    updateUserUI();
                    return true;
                }
            }
            overlay.classList.remove('hidden');
            return false;
        }

        function logoutAuth() {
            state.currentUserRole = null;
            state.lastLoginTime = null;
            saveState();
            document.getElementById('auth-overlay').classList.remove('hidden');
        }

        function updateUserUI() {
            const userName = document.getElementById('user-name');
            const userRole = document.getElementById('user-role');
            if (state.currentUserRole === 'admin') {
                userName.innerText = "Wendy Hernandez";
                userRole.innerHTML = `<i class="fa-solid fa-shield-halved text-[10px]"></i><span>Administrador</span>`;
            } else {
                userName.innerText = "Observador";
                userRole.innerHTML = `<i class="fa-solid fa-eye text-[10px]"></i><span>Solo Lectura</span>`;
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `flex items-center space-x-3 px-4 py-3 rounded-xl shadow-2xl text-sm font-medium text-white ${type === 'success' ? 'bg-emerald-600' : 'bg-red-600'}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function switchTab(tab) {
            state.currentTab = tab;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.className = `nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-sm font-medium ${state.darkMode ? 'text-gray-400 hover:bg-gray-800' : 'text-gray-600 hover:bg-gray-100'} transition-colors`;
            });
            const active = document.getElementById(`nav-${tab}`);
            if (active) active.className = "nav-btn w-full flex items-center justify-between px-3.5 py-3 rounded-xl text-sm font-medium transition-colors bg-amber-600 text-white shadow-md";
            renderView();
        }

        function openModalHTML(html) {
            const modal = document.getElementById('global-modal');
            modal.innerHTML = html;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            const modal = document.getElementById('global-modal');
            modal.classList.add('hidden');
            modal.innerHTML = '';
        }

        function suggestCategoryByName(name) {
            const n = name.toLowerCase();
            if (n.includes('taladro') || n.includes('sierra')) return 'Herramientas Eléctricas';
            if (n.includes('martillo') || n.includes('llave')) return 'Herramientas Manuales';
            if (n.includes('tornillo') || n.includes('clavo')) return 'Fijación y Tornillería';
            if (n.includes('tubo') || n.includes('pvc')) return 'Fontanería y Plomería';
            if (n.includes('pintura') || n.includes('brocha')) return 'Pinturas y Acabados';
            if (n.includes('automotriz') || n.includes('aceite') || n.includes('filtro')) return 'Automotriz';
            return 'Construcción y Medición';
        }

        function renderView() {
            const container = document.getElementById('main-content-view');
            if (!container) return;
            container.innerHTML = '';
            switch(state.currentTab) {
                case 'inventario': renderInventario(container); break;
                case 'movimientos': renderMovimientos(container); break;
                case 'pedidos': renderPedidos(container); break;
                case 'informes': renderInformes(container); break;
                case 'mas': renderMas(container); break;
            }
            updateBadges();
            updateUserUI();
        }

        // ================= 1. INVENTARIO =================
        function renderInventario(container) {
            const categories = ['Todas', ...new Set(state.inventario.map(p => p.categoria))];
            const filtered = state.inventario.filter(p => {
                const matchCat = invCategory === 'Todas' || p.categoria === invCategory;
                const matchQuery = p.nombre.toLowerCase().includes(invSearch.toLowerCase()) || p.sku.toLowerCase().includes(invSearch.toLowerCase());
                return matchCat && matchQuery;
            });

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <h1 class="text-2xl font-bold tracking-tight">Inventario de Bodega</h1>

            const ubicacion = document.getElementById('m-ubicacion').value.trim();
            const cantidad = parseInt(document.getElementById('m-cantidad').value);
            const precio = parseFloat(document.getElementById('m-precio').value);

            if (state.inventario.some(p => p.sku === sku)) {
                showToast("Ya existe un producto con este SKU", "error");
                return;
            }

            state.inventario.push({ sku, nombre, categoria, ubicacion, cantidad, precio });
            saveState();
            closeModal();
            showToast("Producto registrado correctamente", "success");
            renderView();

        function updateProduct(e, oldSku) {
            e.preventDefault();
            const idx = state.inventario.findIndex(x => x.sku === oldSku);
            if (idx === -1) return;
            state.inventario[idx] = {
                sku: document.getElementById('e-sku').value.trim(),
                nombre: document.getElementById('e-nombre').value.trim(),
                categoria: document.getElementById('e-categoria').value,
                ubicacion: document.getElementById('e-ubicacion').value.trim(),
                cantidad: parseInt(document.getElementById('e-cantidad').value),
                precio: parseFloat(document.getElementById('e-precio').value)
            };
            saveState();
            closeModal();
            showToast("Producto actualizado", "success");
            renderView();
        }

        function deleteProduct(sku) {
            if (confirm("¿Estás seguro de eliminar este producto?")) {
                state.inventario = state.inventario.filter(x => x.sku !== sku);
                saveState();
                showToast("Producto eliminado", "success");
                renderView();
            }
        }

        function agregarItemLote() {
            const sku = document.getElementById('mov-select-prod').value;
            const cantidad = parseInt(document.getElementById('mov-cant-prod').value) || 1;
            const p = state.inventario.find(x => x.sku === sku);
            if (!p) return;

            const existing = loteMovimientoItems.find(x => x.sku === sku);
            if (existing) {
                existing.cantidad += cantidad;
            } else {
                loteMovimientoItems.push({ sku: p.sku, nombre: p.nombre, cantidad });
            }

            const container = document.getElementById('lote-items-container');
            container.innerHTML = loteMovimientoItems.map((item, idx) => `
                <div class="flex items-center justify-between bg-gray-50 dark:bg-gray-950 p-2 rounded-lg">
                    <span><b>${item.cantidad}x</b> ${item.nombre} (${item.sku})</span>
                    <button onclick="loteMovimientoItems.splice(${idx},1); agregarItemLote();" class="text-red-500"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        function guardarLoteMovimiento() {
            const cliente = document.getElementById('mov-cliente').value.trim() || 'General';
            if (loteMovimientoItems.length === 0) {
                showToast("Agrega al menos un producto al lote", "error");
                return;
            }

            const fileInput = document.getElementById('mov-foto-file');
            let fotoData = null;

            const finalizar = (fotoUrl) => {
                for (let item of loteMovimientoItems) {
                    const prod = state.inventario.find(x => x.sku === item.sku);
                    if (prod) {
                        if (tipoMovActual === 'ENTRADA') {
                            prod.cantidad += item.cantidad;
                        } else {
                            prod.cantidad = Math.max(0, prod.cantidad - item.cantidad);
                        }
                    }
                }

                state.movimientos.unshift({
                    fecha: new Date().toLocaleString(),
                    tipo: tipoMovActual,
                    cliente,
                    items: [...loteMovimientoItems],
                    foto: fotoUrl,
                    responsable: "Wendy"
                });
                saveState();
                closeModal();
                showToast("Movimiento registrado con éxito", "success");
                renderView();
            };

            if (fileInput && fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = e => finalizar(e.target.result);
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                finalizar(null);
            }
        }

        function verFotoMovimiento(urlEncoded) {
            const url = decodeURIComponent(urlEncoded);
            openModalHTML(`

            `);

                                ${state.pedidos.length === 0 ? `<tr><td colspan="5" class="p-8 text-center text-gray-400">No hay pedidos registrados.</td></tr>` :
                                state.pedidos.map((p, idx) => `
                                    <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/50 transition">
                                        <td class="p-4 text-xs text-gray-500">${p.fecha}</td>
                                        <td class="p-4 font-semibold">${p.proveedor}</td>
                                        <td class="p-4 text-xs">${p.detalle}</td>
                                        <td class="p-4 text-center"><span class="px-2.5 py-1 bg-amber-100 text-amber-800 rounded-full text-xs">${p.estado}</span></td>
                                        <td class="p-4 text-center"><button onclick="state.pedidos.splice(${idx},1); saveState(); renderView();" class="text-red-500"><i class="fa-solid fa-trash"></i></button></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function openPedidoModal() {
            const proveedor = prompt("Proveedor:");
            if (!proveedor) return;
            const detalle = prompt("Productos solicitados:");
            if (!detalle) return;
            state.pedidos.unshift({ fecha: new Date().toLocaleDateString(), proveedor, detalle, estado: "Pendiente" });
            saveState();
            renderView();
        }

        // ================= 4. INFORMES (Impresión y PDF impecables en blanco) =================
        function renderInformes(container) {
            const entradasCount = state.movimientos.filter(m => m.tipo === 'ENTRADA').reduce((acc, m) => acc + m.items.reduce((a,b)=>a+b.cantidad,0), 0);
            const salidasCount = state.movimientos.filter(m => m.tipo === 'SALIDA').reduce((acc, m) => acc + m.items.reduce((a,b)=>a+b.cantidad,0), 0);
            const valorTotal = state.inventario.reduce((acc, p) => acc + (p.cantidad * p.precio), 0);

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <h1 class="text-2xl font-bold tracking-tight">Informes y Reportes</h1>
                            <p class="text-xs text-gray-500">Resumen y exportación profesional</p>
                        </div>
                        <div class="flex space-x-2">
                            <button onclick="window.print()" class="px-4 py-2 bg-gray-800 text-white rounded-xl text-xs font-semibold shadow-md"><i class="fa-solid fa-print mr-1"></i> Imprimir / PDF</button>
                        </div>
                    </div>

                    <div id="report-printable-area" class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl p-6 shadow-sm space-y-6 text-gray-900 dark:text-gray-100">
                        <div class="border-b border-gray-200 dark:border-gray-700 pb-4 flex justify-between items-center">
                            <div>
                                <h2 class="text-xl font-bold">JadeverBodega - Reporte General</h2>
                                <p class="text-xs text-gray-500 mt-1">Fecha de corte: ${new Date().toLocaleDateString()}</p>
                            </div>
                            <div class="text-right text-xs text-gray-400">Sistema de Control Ferretero</div>
                        </div>

                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                            <div class="bg-gray-50 dark:bg-gray-900 p-4 rounded-xl border border-gray-200 dark:border-gray-800">
                                <div class="text-xs text-gray-500">Total Productos</div>
                                <div class="text-xl font-bold mt-1">${state.inventario.length}</div>
                            </div>
                            <div class="bg-gray-50 dark:bg-gray-900 p-4 rounded-xl border border-gray-200 dark:border-gray-800">
                                <div class="text-xs text-gray-500">Entradas del Período</div>
                                <div class="text-xl font-bold text-emerald-600 mt-1">${entradasCount} und</div>
                            </div>
                            <div class="bg-gray-50 dark:bg-gray-900 p-4 rounded-xl border border-gray-200 dark:border-gray-800">
                                <div class="text-xs text-gray-500">Salidas del Período</div>
                                <div class="text-xl font-bold text-rose-600 mt-1">${salidasCount} und</div>
                            </div>
                            <div class="bg-gray-50 dark:bg-gray-900 p-4 rounded-xl border border-gray-200 dark:border-gray-800">
                                <div class="text-xs text-gray-500">Valor Inventario</div>
                                <div class="text-xl font-bold text-amber-600 mt-1">$${valorTotal.toFixed(2)}</div>
                            </div>
                        </div>

                        <h3 class="font-bold text-sm pt-4">Detalle Reciente de Movimientos</h3>
                        <div class="border border-gray-200 dark:border-gray-700 rounded-xl overflow-hidden">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-gray-100 dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700">
                                    <tr>
                                        <th class="p-3">Fecha</th>
                                        <th class="p-3">Tipo</th>
                                        <th class="p-3">Responsable</th>
                                        <th class="p-3">Items</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100 dark:divide-gray-700">
                                    ${state.movimientos.length === 0 ? `<tr><td colspan="4" class="p-4 text-center text-gray-400">Sin movimientos</td></tr>` :
                                    state.movimientos.map(m => `
                                        <tr>
                                            <td class="p-3">${m.fecha}</td>
                                            <td class="p-3 font-semibold">${m.tipo}</td>
                                            <td class="p-3">${m.cliente}</td>
                                            <td class="p-3">${m.items.map(i=>`${i.cantidad}x ${i.nombre}`).join(', ')}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // ================= 5. MÁS =================
        function renderMas(container) {
            container.innerHTML = `
                <div class="space-y-6 max-w-xl">
                    <div>
                        <h1 class="text-2xl font-bold tracking-tight">Más Opciones y Ajustes</h1>
                        <p class="text-xs text-gray-500">Copia de seguridad y mantenimiento del sistema</p>
                    </div>
                    <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl p-6 shadow-sm space-y-3">
                        <h3 class="font-bold">Copia de Seguridad</h3>
                        <p class="text-xs text-gray-500">Descarga un archivo con toda la información de tu bodega.</p>
                        <button onclick="exportarBackup()" class="px-4 py-2 bg-gray-900 dark:bg-gray-700 text-white rounded-xl text-xs font-semibold">Descargar Backup (.json)</button>
                    </div>
                    <div class="bg-white dark:bg-gray-800 border border-red-200 dark:border-red-900/50 rounded-2xl p-6 shadow-sm space-y-3">
                        <h3 class="font-bold text-red-600">Reiniciar Datos (Poner en 0)</h3>
                        <p class="text-xs text-gray-500">Restablece la aplicación a 0 eliminando todo el inventario y movimientos.</p>
                        <button onclick="reiniciarSistema()" class="px-4 py-2 bg-red-600 text-white rounded-xl text-xs font-semibold">Limpiar todo a 0</button>
                    </div>
                </div>
            `;
        }

        function exportarBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", `jadeverbodega_backup_${new Date().toISOString().split('T')[0]}.json`);
            dl.click();
        }

        function reiniciarSistema() {
            if (confirm("¿Estás seguro de poner todo a 0? Se borrará todo.")) {
                state.inventario = [];
                state.movimientos = [];
                state.pedidos = [];
                saveState();
                renderView();
                showToast("Sistema reiniciado a 0", "success");
            }
        }
    </script>
</body>
</html>
